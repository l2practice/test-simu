<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261008b">
<meta name="theme-color" content="#0F6B4F">
<title>Test Simulation · IELTS Practice</title>
<link rel="stylesheet" href="vm-theme.css?v=20261009b">
<style>
.vm-modal-bg{position:fixed;inset:0;background:rgba(14,59,46,.45);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.vm-modal-bg.show{display:flex}
</style>
</head>
<body>

<div class="vm-loading-overlay" id="loadingOverlay">
  <span class="vm-spin"></span>
  <p id="loadingMsg">Signing in…</p>
</div>

<div class="vm-auth-wrap">
  <div class="vm-auth-card">
    <div class="vm-auth-head">
      <div id="brand" style="display:flex;justify-content:center"></div>
      <h1 class="vm-auth-title">Welcome back</h1>
      <p class="vm-auth-sub">Sign in to practice IELTS Reading and Listening.</p>
    </div>

    <form id="form" autocomplete="on">
      <div class="vm-field">
        <label class="vm-label">Student ID or Email</label>
        <input class="vm-input" id="idInput" placeholder="1234567 or you@example.com" autocomplete="username">
        <p style="font-size:.76rem;color:var(--vm-ink-3);margin:6px 0 0">Use your student ID or the email you registered with.</p>
      </div>
      <div class="vm-field">
        <label class="vm-label">Password</label>
        <div class="vm-pass-wrap">
          <input class="vm-input" id="pw" type="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:42px">
          <button type="button" class="vm-pass-toggle" id="pwToggle" title="Show/hide password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.85rem;color:var(--vm-ink-2);cursor:pointer">
        <input type="checkbox" id="rememberMe" style="width:16px;height:16px;cursor:pointer">
        <span>Keep me signed in on this device</span>
      </label>
      <p class="vm-help" style="margin:4px 0 10px">Untick this on a shared lab computer.</p>
      <button class="vm-btn vm-btn-primary vm-btn-block" id="submit" type="submit">Sign in</button>
    </form>

    <div style="text-align:right;margin-top:10px">
      <a href="#" id="forgotStu" style="font-size:.82rem;color:var(--vm-primary);text-decoration:none">Forgot password?</a>
    </div>
    <div style="border-top:1px solid var(--vm-border-2);margin:20px 0 16px"></div>
    <button class="vm-btn vm-btn-ghost vm-btn-block" id="teacherBtn">Teacher sign in</button>
    <p class="vm-auth-alt" style="margin-top:16px">No account yet? <a href="signup.html">Sign up</a></p>
  </div>
</div>

<!-- Teacher modal -->
<div class="vm-modal-bg" id="teacherModal">
  <div class="vm-auth-card" style="max-width:400px;margin:0">
    <div class="vm-auth-head">
      <h1 class="vm-auth-title" style="font-size:1.4rem">Teacher sign in</h1>
      <p class="vm-auth-sub">Sign in with your teacher email.</p>
    </div>
    <div class="vm-field">
      <label class="vm-label">Email</label>
      <input class="vm-input" id="tEmail" type="email" placeholder="ban@dnpu.edu.vn">
    </div>
    <div class="vm-field">
      <label class="vm-label">Password</label>
      <div class="vm-pass-wrap">
        <input class="vm-input" id="tPw" type="password" style="padding-right:42px" placeholder="••••••••">
          <button type="button" class="vm-pass-toggle" id="tPwToggle" title="Show/hide password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
      </div>
    </div>
    <button class="vm-btn vm-btn-primary vm-btn-block" id="tSubmit" style="margin-top:6px">Sign in</button>
    <div style="display:flex;justify-content:space-between;margin-top:12px">
      <a href="#" id="forgotTea" style="font-size:.82rem;color:var(--vm-primary);text-decoration:none">Forgot password?</a>
      <a href="#" id="tClose" style="font-size:.82rem;color:var(--vm-ink-3);text-decoration:none">Cancel</a>
    </div>
  </div>
</div>

<script src="vm-common.js?v=20261009b"></script>
<script>
if (typeof VM === 'undefined') {
  document.body.innerHTML = '<div style="max-width:500px;margin:80px auto;padding:30px;border:2px solid #EA4335;border-radius:14px;font-family:system-ui"><h2>Could not load vm-common.js</h2></div>';
  throw new Error('no VM');
}
document.getElementById('brand').innerHTML = VM.brandLockup();
VM.mountAuthHero('Build your IELTS Reading and Listening skills with practice sets, teacher feedback, and progress tracking.');

// Already logged in?
(function(){ var s=VM.session.get(); if(s&&s.role) location.href=s.role==='teacher'?VM.TEACHER_HOME:VM.STUDENT_HOME; })();

function showLoading(msg){ document.getElementById('loadingMsg').textContent=msg||'Signing in…'; document.getElementById('loadingOverlay').classList.add('show'); }
function hideLoading(){ document.getElementById('loadingOverlay').classList.remove('show'); }

var EYE_ON  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function togglePw(inId,btnId){
  var btn=document.getElementById(btnId);
  if(btn) btn.innerHTML=EYE_ON;
  document.getElementById(btnId).onclick=function(){
    var inp=document.getElementById(inId), hidden=inp.type==='password';
    inp.type=hidden?'text':'password';
    document.getElementById(btnId).innerHTML=hidden?EYE_OFF:EYE_ON;
  };
}
togglePw('pw','pwToggle'); togglePw('tPw','tPwToggle');

var isSub=false;
document.getElementById('form').onsubmit=function(e){
  e.preventDefault(); if(isSub) return;
  var id=(document.getElementById('idInput').value||'').trim();
  var pw=document.getElementById('pw').value;
  if(!id||!pw){VM.toast('Please fill in all fields.','err');return;}
  isSub=true; showLoading();
  VM.api('auth.studentLogin',{studentId:id,password:pw,remember:document.getElementById('rememberMe').checked}).then(function(res){
    if(res&&res.success){
      var r=document.getElementById('rememberMe').checked;
      VM.session.set(Object.assign({role:'student'},res.data),{remember:r});
      VM.bumpLoginCount();
      location.href=(res.data&&res.data.role==='teacher')?VM.TEACHER_HOME:VM.STUDENT_HOME;
    } else {
      hideLoading(); isSub=false;
      VM.toast((res&&res.error)||'Sign in failed.','err',4000);
    }
  }).catch(function(){ hideLoading(); isSub=false; VM.toast('Cannot reach the server.','err'); });
};

var tm=document.getElementById('teacherModal');
document.getElementById('teacherBtn').onclick=function(){ tm.classList.add('show'); };
document.getElementById('tClose').onclick=function(e){ e.preventDefault(); tm.classList.remove('show'); };

var isTSub=false;
document.getElementById('tSubmit').onclick=function(){
  if(isTSub) return;
  var email=(document.getElementById('tEmail').value||'').trim();
  var pw=document.getElementById('tPw').value;
  if(!email||!pw){VM.toast('Enter your email and password.','err');return;}
  isTSub=true; showLoading('Verifying teacher…');
  VM.api('auth.teacherLogin',{email:email,password:pw,remember:!!(document.getElementById('rememberMe')&&document.getElementById('rememberMe').checked)}).then(function(res){
    if(res&&res.success){
      var rm=document.getElementById('rememberMe');
      VM.session.set(Object.assign({role:'teacher'},res.data),{remember:rm?rm.checked:false});
      location.href=VM.TEACHER_HOME;
    } else {
      hideLoading(); isTSub=false;
      VM.toast((res&&res.error)||'Sign in failed.','err',4000);
    }
  }).catch(function(){ hideLoading(); isTSub=false; VM.toast('Cannot reach the server.','err'); });
};

function forgot(){
  VM.prompt('Enter the email you registered with:',{title:'Reset password',placeholder:'you@example.com',ok:'Send'}).then(function(email){ if(!email||!email.trim()) return; forgotSend(email); });
}
function forgotSend(email){
  showLoading('Sending email…');
  VM.api('auth.forgotPassword',{email:email.trim()}).then(function(res){
    hideLoading();
    if(res&&res.success) VM.toast('A new password was sent to your email.','ok',4000);
    else VM.toast((res&&res.error)||'Could not send.','err',4000);
  }).catch(function(){ hideLoading(); VM.toast('Connection error.','err'); });
}
document.getElementById('forgotStu').onclick=function(e){e.preventDefault();forgot();};
document.getElementById('forgotTea').onclick=function(e){e.preventDefault();forgot();};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261008b">
<meta name="theme-color" content="#0F6B4F">
<title>Test Simulation · Create account</title>
<link rel="stylesheet" href="vm-theme.css?v=20261008e">
<style>
.vm-modal-bg{position:fixed;inset:0;background:rgba(14,59,46,.45);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.vm-modal-bg.show{display:flex}
</style>
</head>
<body>

<div class="vm-loading-overlay" id="loadingOverlay">
  <span class="vm-spin"></span>
  <p id="loadingMsg">Processing…</p>
</div>

<div class="vm-auth-wrap">
  <div class="vm-auth-card">
    <div class="vm-auth-head">
      <div id="brand" style="display:flex;justify-content:center"></div>
      <h1 class="vm-auth-title">Sign up</h1>
      <p class="vm-auth-sub">Create your account to practice IELTS Reading and Listening.</p>
    </div>

    <form id="form" autocomplete="on" novalidate>
      <div class="vm-field">
        <label class="vm-label">Full name <span style="color:var(--vm-danger)">*</span></label>
        <input class="vm-input" id="name" placeholder="Nguyen Van A" autocomplete="name">
        <div class="vm-field-err" id="err-name"></div>
      </div>
      <div class="vm-row">
        <div class="vm-field">
          <label class="vm-label">Student ID <span style="color:var(--vm-danger)">*</span></label>
          <input class="vm-input" id="studentId" placeholder="1234567" autocomplete="username">
          <div class="vm-field-err" id="err-studentId"></div>
        </div>
        <div class="vm-field">
          <label class="vm-label">Class code <span style="color:var(--vm-danger)">*</span></label>
          <input class="vm-input" id="class" placeholder="VM-XXXXX" style="text-transform:uppercase" autocomplete="off">
          <div class="vm-field-err" id="err-class"></div>
        </div>
      </div>
      <div class="vm-field">
        <label class="vm-label">Email <span style="color:var(--vm-danger)">*</span></label>
        <input class="vm-input" id="email" type="email" placeholder="ban@email.com" autocomplete="email">
        <div class="vm-field-err" id="err-email"></div>
      </div>
      <div class="vm-row">
        <div class="vm-field">
          <label class="vm-label">Date of birth <span style="color:var(--vm-danger)">*</span></label>
          <input class="vm-input" id="birthdate" type="date" autocomplete="bday">
          <div class="vm-field-err" id="err-birthdate"></div>
        </div>
        <div class="vm-field">
          <label class="vm-label">Phone number <span style="color:var(--vm-danger)">*</span></label>
          <input class="vm-input" id="phone" placeholder="09xx xxx xxx" type="tel" autocomplete="tel">
          <div class="vm-field-err" id="err-phone"></div>
        </div>
      </div>
      <div class="vm-field">
        <label class="vm-label">Password <span style="color:var(--vm-danger)">*</span></label>
        <div class="vm-pass-wrap">
          <input class="vm-input" id="pw" type="password" placeholder="At least 6 characters" autocomplete="new-password" style="padding-right:42px">
          <button type="button" class="vm-pass-toggle" id="pwToggle" title="Show/hide password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="vm-field-err" id="err-pw"></div>
      </div>
      <p style="font-size:.76rem;color:var(--vm-ink-3);margin:0 0 10px">
        <span style="color:var(--vm-danger)">*</span> All fields are required.
      </p>
      <button class="vm-btn vm-btn-primary vm-btn-block" id="submit" type="submit">Create account</button>
    </form>

    <div style="border-top:1px solid var(--vm-border-2);margin:20px 0 16px"></div>
    <button class="vm-btn vm-btn-ghost vm-btn-block" id="teacherReg">🎓 Teacher sign up</button>
    <p class="vm-auth-alt" style="margin-top:16px">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>

<!-- Teacher signup modal -->
<div class="vm-modal-bg" id="teacherModal">
  <div class="vm-auth-card" style="max-width:400px;margin:0">
    <div class="vm-auth-head">
      <h1 class="vm-auth-title" style="font-size:1.4rem">Teacher sign up</h1>
    </div>
    <div class="vm-field">
      <label class="vm-label">Full name <span style="color:var(--vm-danger)">*</span></label>
      <input class="vm-input" id="tName" placeholder="ThS. Nguyen Van A">
      <div class="vm-field-err" id="err-tName"></div>
    </div>
    <div class="vm-field">
      <label class="vm-label">Email <span style="color:var(--vm-danger)">*</span></label>
      <input class="vm-input" id="tEmail" type="email" placeholder="ban@dnpu.edu.vn">
      <div class="vm-field-err" id="err-tEmail"></div>
    </div>
    <div class="vm-row">
      <div class="vm-field">
        <label class="vm-label">Date of birth <span style="color:var(--vm-danger)">*</span></label>
        <input class="vm-input" id="tBirth" type="date">
        <div class="vm-field-err" id="err-tBirth"></div>
      </div>
      <div class="vm-field">
        <label class="vm-label">Phone number <span style="color:var(--vm-danger)">*</span></label>
        <input class="vm-input" id="tPhone" placeholder="09xx" type="tel">
        <div class="vm-field-err" id="err-tPhone"></div>
      </div>
    </div>
    <div class="vm-field">
      <label class="vm-label">Password <span style="color:var(--vm-danger)">*</span></label>
      <div class="vm-pass-wrap">
        <input class="vm-input" id="tPw" type="password" placeholder="At least 6 characters" style="padding-right:42px">
        <button type="button" class="vm-pass-toggle" id="tPwToggle" title="Show/hide password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="vm-field-err" id="err-tPw"></div>
    </div>
    <button class="vm-btn vm-btn-primary vm-btn-block" id="tSubmit" style="margin-top:6px">Create teacher account</button>
    <div style="text-align:right;margin-top:12px">
      <a href="#" id="tClose" style="font-size:.82rem;color:var(--vm-ink-3);text-decoration:none">Cancel</a>
    </div>
  </div>
</div>

<script src="vm-common.js?v=20261008e"></script>
<script>
if (typeof VM === 'undefined') {
  document.body.innerHTML = '<div style="max-width:500px;margin:80px auto;padding:30px;border:2px solid #EA4335;border-radius:14px;font-family:system-ui"><h2>Could not load vm-common.js</h2></div>';
  throw new Error('no VM');
}
document.getElementById('brand').innerHTML = VM.brandLockup();
VM.mountAuthHero('Create an account to practice IELTS Reading and Listening with your class and receive feedback from your teacher.');

function showLoading(msg){ document.getElementById('loadingMsg').textContent=msg||'Processing…'; document.getElementById('loadingOverlay').classList.add('show'); }
function hideLoading(){ document.getElementById('loadingOverlay').classList.remove('show'); }

function setErr(id,msg){
  var inp=document.getElementById(id), err=document.getElementById('err-'+id);
  if(inp) inp.classList.toggle('field-error',!!msg);
  if(err){err.textContent=msg||'';err.classList.toggle('show',!!msg);}
}
function clearErrs(ids){ ids.forEach(function(id){setErr(id,'');}); }

var EYE_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
document.getElementById('pwToggle').onclick=function(){
  var inp=document.getElementById('pw'),h=inp.type==='password';
  inp.type=h?'text':'password';this.innerHTML=h?EYE_OFF:EYE_ON;
};
document.getElementById('tPwToggle').onclick=function(){
  var inp=document.getElementById('tPw'),h=inp.type==='password';
  inp.type=h?'text':'password';this.innerHTML=h?EYE_OFF:EYE_ON;
};

var SF=['name','studentId','class','email','birthdate','phone','pw'];
function validateStudent(){
  clearErrs(SF); var ok=true;
  function req(id,lbl){if(!(document.getElementById(id).value||'').trim()){setErr(id,lbl+' is required.');ok=false;}}
  req('name','Full name');req('studentId','Student ID');req('class','Class code');
  req('email','Email');req('birthdate','Date of birth');req('phone','Phone number');
  var pw=document.getElementById('pw').value||'';
  if(!pw.trim()){setErr('pw','Password is required.');ok=false;}
  else if(pw.trim().length<6){setErr('pw','Password must be at least 6 characters.');ok=false;}
  var email=(document.getElementById('email').value||'').trim();
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setErr('email','Invalid email.');ok=false;}
  return ok;
}

document.getElementById('form').onsubmit=function(e){
  e.preventDefault(); if(!validateStudent()) return;
  showLoading('Checking your details…');
  function trim(id){return (document.getElementById(id).value||'').trim();}
  VM.api('auth.studentSignup',{
    studentId:trim('studentId'),name:trim('name'),
    class:trim('class').toUpperCase(),birthdate:trim('birthdate'),
    password:document.getElementById('pw').value,
    phone:trim('phone'),email:trim('email')
  }).then(function(res){
    hideLoading();
    if(res&&res.success){
      VM.session.set(Object.assign({role:'student'},res.data),{remember:false});
      VM.toast('Sign-up complete!','ok');
      setTimeout(function(){location.href=VM.STUDENT_HOME;},600);
    } else {
      var msg=(res&&res.error)||'Sign-up failed.';
      var field=res&&res.field;
      if(field) setErr(field,msg);
      else if(msg.indexOf('Student ID')>-1) setErr('studentId',msg);
      else if(msg.indexOf('Email')>-1) setErr('email',msg);
      else if(msg.toLowerCase().indexOf('phone')>-1) setErr('phone',msg);
      else if(msg.toLowerCase().indexOf('class')>-1) setErr('class',msg);
      else VM.toast(msg,'err',5000);
    }
  }).catch(function(){ hideLoading(); VM.toast('Cannot reach the server.','err'); });
};
SF.forEach(function(id){
  var el=document.getElementById(id);
  if(el) el.addEventListener('input',function(){setErr(id,'');});
});

var tm=document.getElementById('teacherModal');
document.getElementById('teacherReg').onclick=function(){tm.classList.add('show');};
document.getElementById('tClose').onclick=function(e){e.preventDefault();tm.classList.remove('show');};

var TF=['tName','tEmail','tBirth','tPhone','tPw'];
function validateTeacher(){
  clearErrs(TF); var ok=true;
  function req(id,lbl){if(!(document.getElementById(id).value||'').trim()){setErr(id,lbl+' is required.');ok=false;}}
  req('tName','Full name');req('tEmail','Email');req('tBirth','Date of birth');req('tPhone','Phone number');
  var pw=document.getElementById('tPw').value||'';
  if(!pw.trim()){setErr('tPw','Password is required.');ok=false;}
  else if(pw.trim().length<6){setErr('tPw','Password must be at least 6 characters.');ok=false;}
  var email=(document.getElementById('tEmail').value||'').trim();
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setErr('tEmail','Invalid email.');ok=false;}
  return ok;
}
document.getElementById('tSubmit').onclick=function(){
  if(!validateTeacher()) return;
  showLoading('Creating teacher account…');
  function trim(id){return (document.getElementById(id).value||'').trim();}
  VM.api('auth.teacherSignup',{
    name:trim('tName'),email:trim('tEmail'),birthdate:trim('tBirth'),
    password:document.getElementById('tPw').value,phone:trim('tPhone')
  }).then(function(res){
    hideLoading();
    if(res&&res.success){
      VM.session.set(Object.assign({role:'teacher'},res.data),{remember:false});
      VM.toast('Account created!','ok');
      setTimeout(function(){location.href=VM.TEACHER_HOME;},600);
    } else {
      var msg=(res&&res.error)||'Sign-up failed.';
      if(msg.toLowerCase().indexOf('email')>-1) setErr('tEmail',msg);
      else VM.toast(msg,'err',5000);
    }
  }).catch(function(){ hideLoading(); VM.toast('Cannot reach the server.','err'); });
};
TF.forEach(function(id){
  var el=document.getElementById(id);
  if(el) el.addEventListener('input',function(){setErr(id,'');});
});
</script>
</body>
</html>

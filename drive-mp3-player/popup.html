<!doctype html>
<html lang="vi" data-net="online">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drive MP3 Player</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Thanh tiêu đề -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h1a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H5v-1a7 7 0 0 1 14 0v1h-3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9z" />
        </svg>
        <span class="brand-name">Drive MP3 Player</span>
      </div>
      <div class="top-actions">
        <span id="netPill" class="net-pill" hidden><i class="dot"></i><span id="netText">Online</span></span>
        <button id="settingsBtn" class="icon-btn" title="Cài đặt" aria-label="Cài đặt">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" /></svg>
        </button>
        <button id="signOutBtn" class="icon-btn" title="Đăng xuất" aria-label="Đăng xuất" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M5 3h8a2 2 0 0 1 2 2v3h-2V5H5v14h8v-3h2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm12.6 5.6L21 12l-3.4 3.4-1.4-1.4 1.6-1.6H9v-2h8.8l-1.6-1.6z" /></svg>
        </button>
      </div>
    </header>

    <div id="offlineBanner" class="banner" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z" /></svg>
      Không có Internet. Chỉ hiển thị file đã lưu offline.
    </div>

    <!-- 1. Màn hình đăng nhập -->
    <section id="loginView" class="view login" hidden>
      <div class="hero" aria-hidden="true">
        <svg viewBox="0 0 160 140" width="150" height="132">
          <path d="M22 84V72a58 58 0 0 1 116 0v12" fill="none" stroke="#c7d7ff" stroke-width="9" stroke-linecap="round" />
          <rect x="10" y="74" width="22" height="42" rx="11" fill="#c7d7ff" />
          <rect x="128" y="74" width="22" height="42" rx="11" fill="#c7d7ff" />
          <g transform="translate(48 38) scale(0.64)">
            <polygon points="33,0 0,57 17,86 50,29" fill="#0f9d58" />
            <polygon points="33,0 67,0 100,57 66,57" fill="#fbbc04" />
            <polygon points="17,86 83,86 100,57 34,57" fill="#4285f4" />
          </g>
        </svg>
      </div>
      <h1 class="login-title">Nghe nhạc &amp; âm thanh từ<br />Google Drive của bạn</h1>

      <button id="googleBtn" class="google-btn">
        <svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true">
          <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z" />
          <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z" />
          <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z" />
          <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z" />
        </svg>
        Đăng nhập bằng Google
      </button>
      <button id="guestBtn" class="guest-btn">
        <span id="guestTitle">Nghe các file đã lưu Offline</span>
        <small>dành cho không có mạng</small>
      </button>
    </section>

    <!-- 2 + 3. Danh sách (online / offline) -->
    <section id="listView" class="view list-view" hidden>
      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z" /></svg>
          <input id="searchInput" type="text" placeholder="Tìm kiếm file MP3…" autocomplete="off" />
          <button id="clearSearch" class="clear-btn" title="Xóa" aria-label="Xóa tìm kiếm" hidden>✕</button>
        </div>
        <button id="uploadBtn" class="icon-btn upload-btn" title="Upload file MP3 từ máy tính" aria-label="Upload file MP3">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5v2zM12 4 6.5 9.5l1.4 1.4L11 7.8V16h2V7.8l3.1 3.1 1.4-1.4L12 4z" /></svg>
        </button>
        <input id="fileInput" type="file" accept=".mp3,audio/mpeg" hidden />
      </div>

      <nav id="tabs" class="tabs" role="tablist">
        <button id="tabAll" class="tab" role="tab">Tất cả (0)</button>
        <button id="tabCached" class="tab" role="tab">Đã lưu Offline (0)</button>
      </nav>

      <div id="listArea" class="list-area">
        <ul id="fileList" class="file-list"></ul>
        <div id="emptyState" class="empty" hidden></div>
        <button id="loadMoreBtn" class="more-btn" hidden>Tải thêm</button>
      </div>
    </section>

    <!-- Cài đặt -->
    <section id="settingsView" class="view settings" hidden>
      <button id="backBtn" class="back-btn">← Quay lại</button>

      <div class="card">
        <h3>Bộ nhớ trên máy</h3>
        <p id="storageInfo" class="muted"></p>
        <button id="clearAllBtn" class="danger-btn">Xóa tất cả file đã lưu</button>
        <p class="muted small">File trên Google Drive không bị ảnh hưởng. Bạn có thể tải lại bằng cách phát lần nữa.</p>
      </div>

      <div id="uploadOpt" class="card" hidden>
        <h3>Upload</h3>
        <label class="check-row">
          <input id="uploadToDrive" type="checkbox" />
          <span>Khi upload file từ máy, đồng thời lưu bản sao lên Google Drive</span>
        </label>
      </div>

      <p class="about">Drive MP3 Player v1.0.0</p>
    </section>

    <!-- Thanh phát cố định ở dưới -->
    <footer id="playerBar" class="player-bar" hidden>
      <div id="nowPlaying" class="now-playing"></div>
      <div class="timeline">
        <span id="timeCurrent" class="time">0:00</span>
        <input id="seekBar" type="range" min="0" max="1000" step="1" value="0" disabled aria-label="Thanh tiến trình" />
        <span id="timeTotal" class="time">0:00</span>
      </div>
      <div class="controls">
        <button id="backSkip" class="skip" title="Tua lùi 5 giây (←)" disabled>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" /></svg>
          <span>5s</span>
        </button>
        <button id="playBtn" class="play-btn" title="Phát / Tạm dừng (Space)" disabled>
          <svg id="iconPlay" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z" /></svg>
          <svg id="iconPause" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" hidden><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
        </button>
        <button id="fwdSkip" class="skip" title="Tua tới 5 giây (→)" disabled>
          <span>5s</span>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z" /></svg>
        </button>
      </div>
    </footer>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>

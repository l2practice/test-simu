#pickListening{background:linear-gradient(135deg,#B65A12,#E07A1F 60%,#F5A55F)!important}

.il-warn{background:linear-gradient(120deg,var(--il-blt),#fff);border:1px solid var(--il-b);border-left:6px solid var(--il-b);border-radius:14px;padding:12px 16px;margin:0 0 12px;font-size:.9rem;line-height:1.55;color:var(--vm-ink)}.il-warn-soft{background:linear-gradient(120deg,var(--il-asoft),#fff);border-color:var(--il-a)}
.il-chip-pending{border-style:dashed!important;border-color:var(--il-b)!important;background:linear-gradient(180deg,#fff,var(--il-blt))!important;color:var(--il-bdk)!important}.il-chip-pending:disabled{opacity:.85;cursor:not-allowed}
.il-tocheck{border-left:6px solid var(--il-b)}.il-count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--il-b);color:#3A1D00;font-size:.75rem;font-weight:800;margin-left:6px}
.il-check-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--vm-border)}
.vm-nav{position:relative}.vm-nav-badge{position:absolute;top:2px;right:6px;margin:0;min-width:18px;height:18px;border-radius:9px;padding:0 5px;font-size:.66rem;display:grid;place-items:center;background:var(--il-b);color:#3A1D00;font-weight:800;box-shadow:0 3px 6px rgba(196,106,28,.45)}
.ed-imgs{margin:0 0 8px}.ed-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.ed-thumb{position:relative;display:inline-block}.ed-thumb img{max-height:84px;border-radius:8px;border:1px solid var(--vm-border);display:block}.ed-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#C23A2E;color:#fff;cursor:pointer;font-size:.8rem;line-height:1}.il-img{max-width:100%;height:auto;border-radius:10px;margin:6px 0 12px;border:1px solid var(--vm-border)}

/* question layouts */
.il-group{margin:6px 0 20px}.il-qt{width:100%;border-collapse:collapse;border:none;margin:4px 0}.il-qt td{border:none;padding:8px 6px;vertical-align:middle}.il-qt tr:nth-child(odd) td{background:rgba(10,63,48,.035)}.il-qt .qn{width:44px;text-align:center}.il-qt .qt{line-height:1.5;padding-right:14px}.il-qt .qa{width:150px}.mg .il-qt .qa{width:76px}.il-qt .qt{min-width:120px}.il-qt .qm{width:34px;text-align:center}
.il-ans{width:100%;padding:8px 10px}.mt-in{max-width:90px;text-align:center;font-weight:700;text-transform:uppercase}.il-sel{width:100%;padding:8px 10px}.il-sel-fixed{min-width:150px}
.il-mk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-weight:800;font-size:.8rem;color:#fff}.il-mk.ok{background:#1E8A5E}.il-mk.bad{background:#C23A2E}
.il-ans.ok,.gap-in.ok,.il-sel.ok{border-color:#1E8A5E!important;background:#E6F6EC!important}.il-ans.bad,.gap-in.bad,.il-sel.bad{border-color:#C23A2E!important;background:#FDECEA!important}
.mg{display:block}.mg-two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(190px,1fr);gap:16px;align-items:start}.mg-opts{background:linear-gradient(180deg,#fff,var(--il-asoft));border:1px solid var(--vm-border);border-radius:14px;padding:12px 14px;position:sticky;top:8px}.mg-title{font-weight:800;color:var(--il-adk);margin-bottom:8px}.mg-opt{display:flex;gap:10px;padding:5px 0;font-size:.9rem;line-height:1.4;border-top:1px dashed var(--vm-border)}.mg-opt b{min-width:20px;color:var(--il-a)}.mg-hint{margin:4px 0}
@media(max-width:1100px){.mg-two{grid-template-columns:1fr}.mg-opts{position:static}}
.il-gapbox{background:linear-gradient(180deg,#fff,var(--il-asoft));border:1px solid var(--vm-border);border-radius:14px;padding:14px 16px}.il-gaptext{white-space:pre-wrap;line-height:2.3}.gap-wrap{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;margin:0 2px}.gap-n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:var(--il-a);color:#fff;font-size:.72rem}.gap-in{width:150px;padding:4px 8px;border-radius:8px;border:1.5px solid var(--il-a)}.gap-sel{min-width:130px;padding:4px 8px}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}.lab-cell{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--vm-border);border-radius:12px;padding:6px 8px}.lab-in{width:100%;padding:6px 8px}
.il-opts-ro{display:grid;gap:4px;margin:6px 0 10px}.il-opt-ro{display:flex;gap:10px;padding:6px 10px;border:1px solid var(--vm-border);border-radius:10px;background:#fff}.il-opt-ro b{min-width:18px;color:var(--il-a)}.il-multi{display:flex;gap:10px;flex-wrap:wrap}.il-multi-c{display:flex;align-items:center;gap:8px}
.il-busy{position:fixed;inset:0;z-index:400;background:rgba(10,63,48,.42);display:grid;place-items:center}.il-busy-card{background:#fff;border-radius:20px;padding:26px 34px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);max-width:340px}.il-busy-card b{display:block;margin-top:12px;color:var(--il-adk)}.il-spinner{width:44px;height:44px;border-radius:50%;border:5px solid var(--il-alt);border-top-color:var(--il-a);margin:0 auto;animation:ilspin .8s linear infinite}@keyframes ilspin{to{transform:rotate(360deg)}}

.il-nt-wrap{overflow-x:auto;margin:8px 0}.il-nt{border-collapse:collapse;width:100%;background:#fff}.il-nt th,.il-nt td{border:1px solid var(--vm-border);padding:8px 10px;vertical-align:top;line-height:1.7;text-align:left;white-space:normal}.il-nt th{background:var(--il-asoft);font-weight:800}
.il-gaptext .il-nt-wrap{white-space:normal}
.il-ans,.gap-in,.il-sel,.lab-in,.il-qt select,.gap-sel{background:#fff!important;border:2px solid var(--il-a)!important;box-shadow:0 2px 0 rgba(10,63,48,.12),inset 0 1px 3px rgba(10,63,48,.1)!important;color:var(--vm-ink)}
.il-ans:focus,.gap-in:focus,.il-sel:focus,.lab-in:focus{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--il-a) 28%,transparent)!important;border-color:var(--il-adk)!important}
.mt-in{min-width:64px;height:40px;font-size:1.05rem}
.il-qt tr:nth-child(odd) td{background:rgba(10,63,48,.06)}
.il-ans.ok,.gap-in.ok,.il-sel.ok{border-color:#1E8A5E!important;background:#E6F6EC!important}.il-ans.bad,.gap-in.bad,.il-sel.bad{border-color:#C23A2E!important;background:#FDECEA!important}
.ed-title{flex:1;min-width:220px;max-width:520px;font-weight:600}
/* task type page */
.ty-sect{margin:18px 0 6px;display:flex;align-items:center;gap:10px}.ty-sect h2{margin:0;font-family:var(--vm-font-display);font-size:1.25rem}
.ty-card .ty-desc{font-size:.84rem;color:var(--vm-ink-2);line-height:1.5;margin:6px 0 10px;min-height:2.6em}.ty-card.ty-off{opacity:.62}
.hl-b{background:#9AD7FF}.hl-o{background:#FFC58A}mark.hl-blue{background:#9AD7FF}mark.hl-orange{background:#FFC58A}

/* page banner: compact, smooth emerald → orange gradient */
.ielts-wrap .ielts-hero{position:relative;overflow:hidden;isolation:isolate;border:none!important;border-radius:22px!important;padding:22px 30px 22px 30px!important;margin-bottom:18px!important;color:#fff!important;
 background:linear-gradient(105deg,#0A3F30 0%,#0F6B4F 45%,#1FA77A 100%)!important;
 box-shadow:0 14px 30px -14px rgba(10,63,48,.55),inset 0 1px 0 rgba(255,255,255,.28)!important;min-height:0}
.ielts-wrap .ielts-hero::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;
 background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:36px 36px;
 -webkit-mask-image:linear-gradient(90deg,transparent 5%,#000 55%,transparent 90%);mask-image:linear-gradient(90deg,transparent 5%,#000 55%,transparent 90%)}
.ielts-wrap .ielts-hero::after{content:'';position:absolute;z-index:-1;pointer-events:none;width:230px;height:230px;right:-48px;top:-96px;left:auto;transform:none;border-radius:50%;
 background:linear-gradient(140deg,#FFC48A 0%,#F08A3C 100%);box-shadow:-120px 118px 0 -62px rgba(255,255,255,.14)}
 background:radial-gradient(circle,rgba(255,255,255,.34) 0%,rgba(255,214,170,.22) 40%,transparent 70%)}
.ielts-wrap .ielts-hero h2{margin:0 0 4px!important;font-size:clamp(1.25rem,2.4vw,1.65rem);font-weight:800;letter-spacing:-.02em;line-height:1.2}
.ielts-wrap .ielts-hero p{margin:0!important;font-size:.95rem;line-height:1.5;max-width:68ch;opacity:.94}
@media(max-width:600px){.ielts-wrap .ielts-hero{padding:18px 20px!important;border-radius:18px!important}}

/* bold instructions and passage / part titles */
.il-instr,.il-gaptext .gt-instr{font-weight:700}
.gt-instr{display:block;font-weight:700;color:var(--il-adk);line-height:1.6}
.gt-title{display:block;font-weight:800;font-size:1.12em;color:var(--vm-ink);margin:6px 0 4px;text-align:center}
.il-text .pt-title{display:block;font-weight:800;font-size:1.22em;line-height:1.35;margin:0 0 10px;color:var(--il-adk)}

/* flat, solid controls (no glass) */
:root{--vm-glass:0 2px 14px rgba(10,63,48,.08)}
.vm-btn-primary,.exam-submit{background:var(--il-a)!important;color:#fff!important;border:1.5px solid transparent!important;box-shadow:none!important;filter:none}
.vm-btn-primary:hover:not(:disabled),.exam-submit:hover:not(:disabled){background:var(--il-adk)!important;filter:none;transform:none}
.vm-btn-accent{background:var(--il-b)!important;color:#fff!important;border:1.5px solid transparent!important;box-shadow:none!important;filter:none}
.vm-btn-accent:hover:not(:disabled){background:var(--il-bdk)!important;color:#fff!important;filter:none;transform:none}
.vm-btn-ghost{background:#fff!important;color:var(--il-adk)!important;border:1.5px solid #CBDCD2!important;box-shadow:none!important}
.vm-btn-ghost:hover:not(:disabled){background:var(--il-asoft)!important;border-color:var(--il-a)!important;box-shadow:none!important}
.vm-btn-danger{background:var(--vm-danger)!important;color:#fff!important;box-shadow:none!important;border:1.5px solid transparent!important}
.vm-btn:disabled,.vm-btn[disabled]{opacity:.5;box-shadow:none!important}
.vm-nav.active{background:var(--il-a)!important;box-shadow:none!important}
.vm-logo-mark{box-shadow:none!important}
.vm-user{box-shadow:none;border:1px solid var(--vm-border-2)}
.vm-input,.vm-select{background:#fff;box-shadow:none}

.il-panel,.il-card,.gl-card{background:#fff!important;border:1px solid var(--vm-border-2)!important;box-shadow:0 2px 14px rgba(10,63,48,.07)!important}
.il-sticky{background:#fff!important;box-shadow:0 2px 14px rgba(10,63,48,.08)!important}
.il-chip{background:var(--il-asoft)!important}
.il-seg button.on{background:var(--il-a)!important;box-shadow:none!important}
.ty-card h3{font-size:1.2rem;font-weight:800;letter-spacing:-.01em;color:var(--il-adk);line-height:1.25;margin:0}
.ty-card .ty-desc{margin:8px 0 14px;color:var(--vm-ink-2)}
.ty-card.ty-off h3{color:var(--vm-ink-3)}

/* countdown colours */
.exam-clock.w15{background:#E0A800!important;color:#3A2600!important}
.exam-clock.w10{background:#F08A3C!important;color:#fff!important}
.exam-clock.w5{background:#C23A2E!important;color:#fff!important;animation:clockPulse 1s ease-in-out infinite}
@keyframes clockPulse{50%{box-shadow:0 0 0 6px rgba(194,58,46,.35)}}
@media (prefers-reduced-motion:reduce){.exam-clock.w5{animation:none}}
/* choose-N tick boxes */
.il-opts-check .il-opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--vm-border);border-radius:12px;margin:8px 0;background:#fff}
.il-opts-check .il-opt:hover{border-color:var(--il-a)}
.il-opts-check input[type=checkbox]{width:22px;height:22px;margin-top:1px;border-radius:5px}
.il-opts .il-opt input[type=radio]{width:22px;height:22px}
.il-multi-marks{display:flex;gap:14px;margin-top:6px;align-items:center}
.ai-h{margin:14px 0 4px;font-size:1.02rem;font-weight:800;color:var(--il-adk)}
.ai-l{margin:3px 0;line-height:1.55}.ai-bad{font-weight:700;color:#A5281E}

/* reading comfort: zoom + display modes */
.exam-tools{display:flex;align-items:center;gap:6px}
.exam-tools .exam-btn{padding:5px 10px;min-height:36px;font-weight:800}
.exam-zval{min-width:46px;text-align:center;font-weight:700;font-size:.82rem}
.exam-pane{zoom:var(--z,1)}
/* dark */
body.exam-dark{color-scheme:dark;--vm-ink:#E6EFE9;--vm-ink-2:#C9D9CF;--vm-ink-3:#A5BBAE;--vm-border:#2E4338;--vm-border-2:#26382F;--vm-surface:#15211B;--vm-surface-2:#1B2B23;--il-asoft:#1B2B23;--il-blt:#2B2216;--il-alt:#1F3328}
body.exam-dark .exam{background:#0E1713!important}

body.exam-dark .il-gapbox,body.exam-dark .il-group,body.exam-dark .il-qt tr,body.exam-dark .il-nt,body.exam-dark .il-nt th,body.exam-dark .il-nt td{background:#1A2922!important;color:#E6EFE9}
body.exam-dark .il-qt tr:nth-child(even){background:#17241E!important}

body.exam-dark .il-ans,body.exam-dark .gap-in,body.exam-dark .il-sel,body.exam-dark .lab-in,body.exam-dark .il-qt select,body.exam-dark .gap-sel,body.exam-dark .vm-input,body.exam-dark .vm-select{background:#0C1511!important;color:#F2F8F4!important;border-color:var(--il-a2)!important}
body.exam-dark .en-n{background:#1A2922;color:#E6EFE9;border-color:#3A5446}
body.exam-dark .en-part.cur{background:#1F3328}
body.exam-dark .exam-btn{background:rgba(255,255,255,.1)}
body.exam-dark .en-actions .exam-btn,body.exam-dark .en-label{background:#1A2922;color:#E6EFE9;border-color:#3A5446}
body.exam-dark mark.hl{color:#101010}
body.exam-dark .il-note{color:#A5BBAE}
/* high contrast */
body.exam-hc{--vm-ink:#000;--vm-ink-2:#000;--vm-ink-3:#1A1A1A;--vm-border:#000;--vm-border-2:#000;--il-asoft:#fff;--il-blt:#fff;--il-alt:#fff}

.wb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 12px}
.wb-item{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--vm-border);border-radius:12px;padding:8px 10px;line-height:1.35}
.wb-item b{flex:0 0 auto;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--il-a);color:#fff;font-size:.85rem}

/* roomier exam panes */
.exam-split{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}

@media(min-width:760px){.wb-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
body.exam-dark .il-wordbank{background:#16241D!important;border-color:#2E4338}
body.exam-hc .il-wordbank{border:2px solid #000}

 :[['glance','Glance','overview','ielts.html#glance'],['library','IELTS Practice','reading','ielts.html#library'],['types','Task Types','assign','ielts.html#types'],['inclass','In-class','inclass','ielts.html#inclass'],['settings','Settings','edit','student.html#tab=settings']];

/* ───────── Glance: score chart (Reading green, Listening orange), table view, task-type accuracy ───────── */
function typeStats(attempts){
 var m={};
 attempts.forEach(function(a){
  var secs=(a.snapshot&&a.snapshot.sections)||[],qs=[];secs.forEach(function(s){(s.questions||[]).forEach(function(q){qs.push(q);});});
  (a.responses||[]).forEach(function(r,i){var q=qs[i];if(!q||r.correct===null||r.correct===undefined)return;var k=a.skill+'|'+(q.type||'short-answer'),e=m[k]||(m[k]={skill:a.skill,type:q.type||'short-answer',ok:0,n:0});e.n++;if(r.correct)e.ok++;});
 });
 return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return b.n-a.n;});
}
function glanceView(box,attempts,opts){
 opts=opts||{};
 var st={skill:'all',view:'chart',hide:{}};
 var data=attempts.filter(function(a){return typeof a.score==='number'&&isFinite(a.score);}).sort(function(a,b){return String(a.completedAt).localeCompare(String(b.completedAt));});
 box.innerHTML='<div class="il-panel gl-panel"><div class="il-toolbar"><div class="il-seg" id="glSkill"><button data-s="all" class="on">All skills</button><button data-s="reading">Reading</button><button data-s="listening">Listening</button></div><span class="il-spacer"></span><div class="il-seg" id="glView"><button data-v="chart" class="on">Chart</button><button data-v="table">Table</button></div></div><div id="glBody"></div></div><div class="il-panel" id="glTypes"></div>';
 function seg(id,key){qa('#'+id+' button').forEach(function(b){b.onclick=function(){st[key]=b.getAttribute(key==='skill'?'data-s':'data-v');qa('#'+id+' button').forEach(function(x){x.classList.toggle('on',x===b);});draw();};});}
 seg('glSkill','skill');seg('glView','view');
 function cur(){return data.filter(function(a){return st.skill==='all'||a.skill===st.skill;});}
 function stats(skill){var r=data.filter(function(a){return a.skill===skill;});if(!r.length)return{n:0,latest:'—',avg:'—',best:'—'};var sc=r.map(function(a){return a.score;});return{n:r.length,latest:sc[sc.length-1]+'%',avg:Math.round(sc.reduce(function(x,y){return x+y;},0)/sc.length)+'%',best:Math.max.apply(null,sc)+'%'};}
 function draw(){
  var body=document.getElementById('glBody'),rows=cur();
  if(!data.length){body.innerHTML='<div class="il-empty">'+(opts.empty||'No practice yet. Complete a test to see your progress here.')+'</div>';document.getElementById('glTypes').innerHTML='';return;}
  var cards=['reading','listening'].filter(function(s){return st.skill==='all'||st.skill===s;}).map(function(s){var x=stats(s);return '<div class="gl-card" style="border-top-color:'+(s==='reading'?C_READ:C_LIST)+'"><div class="gl-card-h">'+(s==='reading'?'Reading':'Listening')+'</div><div class="gl-big">'+x.latest+'</div><div class="il-note">latest · avg '+x.avg+' · best '+x.best+' · '+x.n+' practice'+(x.n===1?'':'s')+'</div></div>';}).join('');
  if(st.view==='table'){
   body.innerHTML='<div class="gl-cards">'+cards+'</div><div style="overflow:auto"><table class="vm-table"><thead><tr><th>Date</th><th>Test</th><th>Skill</th><th>Score</th><th>Correct</th><th>Time</th><th>Feedback</th></tr></thead><tbody>'+rows.slice().reverse().map(function(a){return '<tr><td>'+fmtDate(a.completedAt)+'</td><td>'+esc(a.title)+'</td><td><span class="il-dot" style="background:'+(a.skill==='reading'?C_READ:C_LIST)+'"></span>'+esc(a.skill)+'</td><td><b>'+a.score+'%</b></td><td>'+a.correct+'/'+a.gradedCount+'</td><td>'+Math.max(1,Math.round(a.durationSeconds/60))+' min</td><td>'+(docUrlOk(a.feedbackDocUrl)?'<a href="'+esc(a.feedbackDocUrl)+'" target="_blank" rel="noopener">Open doc</a>':'<span class="il-note">—</span>')+'</td></tr>';}).join('')+'</tbody></table></div>';
  }else{
   var w=760,h=300,pl=40,pr=18,pt=16,pb=34,t0=new Date(rows[0]?rows[0].completedAt:Date.now()).getTime(),t1=new Date(rows.length?rows[rows.length-1].completedAt:Date.now()).getTime();
   function X(a,i){if(rows.length<2||t1===t0)return pl+(w-pl-pr)*(rows.length<2?0.5:i/(rows.length-1));return pl+(w-pl-pr)*((new Date(a.completedAt).getTime()-t0)/(t1-t0));}
   function Y(v){return pt+(h-pt-pb)*(1-v/100);}
   var grid='';[0,25,50,75,100].forEach(function(v){grid+='<line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#DCE6EC" stroke-dasharray="'+(v?'3 4':'0')+'"/><text x="'+(pl-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="#5C7482">'+v+'</text>';});
   var series=['reading','listening'].filter(function(s){return (st.skill==='all'||st.skill===s)&&!st.hide[s];}).map(function(s){
    var col=s==='reading'?C_READ:C_LIST,pts=rows.map(function(a,i){return a.skill===s?{x:X(a,i),y:Y(a.score),a:a}:null;}).filter(Boolean);
    return (pts.length>1?'<polyline fill="none" stroke="'+col+'" stroke-width="3" stroke-linejoin="round" points="'+pts.map(function(p){return p.x+','+p.y;}).join(' ')+'"/>':'')+pts.map(function(p){return '<circle class="gl-pt" cx="'+p.x+'" cy="'+p.y+'" r="6" fill="#fff" stroke="'+col+'" stroke-width="3" data-tip="'+esc(p.a.title+' · '+p.a.score+'% · '+p.a.correct+'/'+p.a.gradedCount+' correct · '+fmtDate(p.a.completedAt))+'"/>';}).join('');}).join('');
   var xl=rows.length?[0,Math.floor((rows.length-1)/2),rows.length-1].filter(function(v,i,arr){return arr.indexOf(v)===i;}).map(function(i){return '<text x="'+X(rows[i],i)+'" y="'+(h-10)+'" text-anchor="middle" font-size="11" fill="#5C7482">'+fmtDate(rows[i].completedAt)+'</text>';}).join(''):'';
   body.innerHTML='<div class="gl-cards">'+cards+'</div><div class="gl-legend"><button class="gl-leg'+(st.hide.reading?' off':'')+'" data-l="reading"><i style="background:'+C_READ+'"></i>Reading</button><button class="gl-leg'+(st.hide.listening?' off':'')+'" data-l="listening"><i style="background:'+C_LIST+'"></i>Listening</button><span class="il-note">Hover a point for details · click a legend item to show/hide a line</span></div><div class="gl-chart-wrap"><svg viewBox="0 0 '+w+' '+h+'" class="gl-chart" role="img" aria-label="Practice score over time">'+grid+series+xl+'</svg><div class="gl-tip" id="glTip"></div></div>';
   qa('.gl-leg').forEach(function(b){b.onclick=function(){var s=b.getAttribute('data-l');st.hide[s]=!st.hide[s];draw();};});
   var tip=document.getElementById('glTip');
   qa('.gl-pt').forEach(function(c){c.onmouseenter=function(){tip.textContent=c.getAttribute('data-tip');tip.style.display='block';var wr=tip.parentNode.getBoundingClientRect(),cr=c.getBoundingClientRect();tip.style.left=Math.min(wr.width-220,Math.max(0,cr.left-wr.left-90))+'px';tip.style.top=(cr.top-wr.top-46)+'px';};c.onmouseleave=function(){tip.style.display='none';};});
  }
  var ts=typeStats(rows.length?rows:[]).filter(function(t){return st.skill==='all'||t.skill===st.skill;});
  document.getElementById('glTypes').innerHTML='<h3 style="margin-top:0">Accuracy by task type</h3>'+(ts.length?ts.map(function(t){var pc=Math.round(t.ok*100/t.n);return '<div class="il-bar"><span><i class="il-dot" style="background:'+(t.skill==='reading'?C_READ:C_LIST)+'"></i>'+esc(typeName(t.type))+(st.skill==='all'?' <span class="il-note">· '+(t.skill==='reading'?'Reading':'Listening')+'</span>':'')+'</span><div><i style="width:'+pc+'%;background:'+(pc>=70?C_READ:(pc>=40?C_LIST:'#C23A2E'))+'"></i></div><b>'+t.ok+'/'+t.n+'</b></div>';}).join(''):'<div class="il-note">Task-type accuracy appears after you complete tests with answer keys.</div>');
 }
 draw();
}
function drawGlanceStudent(){
 setTitle('Glance');
 root().innerHTML='<div class="ielts-wrap wide"><div class="ielts-hero"><h2>Your progress at a glance</h2><p>Scores across your practices: Reading in green, Listening in orange.</p></div><div id="glBox"></div></div>';

function drawGlanceTeacher(){
 setTitle('Glance');
 root().innerHTML='<div class="ielts-wrap wide"><div class="ielts-hero"><h2>Class glance</h2><p>Choose a class to see each student’s scores and the latest practice activity.</p></div><div class="il-toolbar"><select class="vm-select" id="gClass"><option value="">Select a class…</option>'+state.classes.map(function(c){return '<option value="'+esc(c.classId)+'"'+(state.glanceClass===c.classId?' selected':'')+'>'+esc(c.className)+'</option>';}).join('')+'</select><label class="il-note" for="gPeriod" style="margin-left:8px">Period</label><select class="vm-select" id="gPeriod">'+[['14','Last 2 weeks'],['30','Last 1 month'],['60','Last 2 months'],['90','Last 3 months'],['0','All time']].map(function(o){return '<option value="'+o[0]+'"'+((state.glancePeriod||'14')===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div><div id="gBody"><div class="il-empty">Select a class to view scores.</div></div></div>';
 document.getElementById('gPeriod').onchange=function(){state.glancePeriod=this.value;loadClass();};

 function loadClass(){
  var body=document.getElementById('gBody');
  if(!state.glanceClass){body.innerHTML='<div class="il-empty">Select a class to view scores.</div>';return;}
  body.innerHTML='<div class="il-empty">Loading…</div>';
  var days=+(state.glancePeriod||'14'),since=days?new Date(Date.now()-days*86400000).toISOString():'';
  Promise.all([call('ielts.attempt.list',{classId:state.glanceClass,since:since}),call('class.roster',{classId:state.glanceClass})]).then(function(v){drawClass(v[0]||[],v[1]||[]);}).catch(function(e){body.innerHTML='<div class="il-empty">'+esc(e.message)+'</div>';});

 function drawClass(att,roster){

  var names={};roster.forEach(function(s){names[s.studentId]=s.name;});att.forEach(function(a){names[a.studentId]=names[a.studentId]||a.studentName;});
  var recent=att.slice().sort(function(a,b){return String(b.completedAt).localeCompare(String(a.completedAt));}).slice(0,12).map(function(a){return{t:a.completedAt,html:'<span class="il-feed-ic ok">✓</span><div><b>'+esc(a.studentName||a.studentId)+'</b> completed <b>'+esc(a.title)+'</b> <span class="il-note">· '+(a.score===null?'no key':a.score+'%')+' · '+a.correct+'/'+a.gradedCount+' correct</span></div>'};});

}
function txtCtl(c,f,cls,ph){var i=f.n-1;return '<input class="vm-input '+(cls||'il-ans')+qcls(c,f)+'" type="text" data-q="'+i+'" value="'+esc(c.r.answers[i]||'')+'" placeholder="'+esc(ph||'')+'" autocomplete="off"'+c.dis+'>';}
function gapInline(text,byNum,mk){
 var re=/(^|[^\d])(\d{1,2})(\s*\)?\s*[‘'"“]?\s*)([£$€¥]?)\s*(?:[\.…_]{3,}|…)([’'"”]?)/g,out='',last=0,m,used={};
 while((m=re.exec(text))){var f=byNum[+m[2]];if(!f)continue;out+=esc(text.slice(last,m.index+m[1].length))+(m[4]?esc(m[4])+' ':'')+mk(f);used[+m[2]]=1;last=m.index+m[0].length;}
 return{html:out+esc(text.slice(last)),used:used};
}
function tableCells(line){
 var t=line.replace(/\s+$/,'');
 if(t.indexOf('\t')>=0){var c=t.split('\t').map(function(x){return x.replace(/\u200B/g,'').trim();});while(c.length&&c[c.length-1]==='')c.pop();return c.length>=2?c:null;}
 if(/^\s*\|.*\|?\s*$/.test(t)){var p=t.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(x){return x.trim();});return p.length>=2?p:null;}
 return null;
}
/* Renders text where runs of tab- or pipe-separated lines become real tables; cells may hold numbered blanks. */
function richHtml(text,byNum,mk){
 var lines=String(text||'').split('\n'),out='',buf=[],used={};
 var INSTR=/^(questions?\s+\d|complete\b|choose\b|write\b|label\b|match\b|do the following|look at|answer the|which\b|read the|use the|the diagram|the table|the plan|the map|the flow)/i,sawInstr=false,titled=false;
 function cell(x){if(!mk)return esc(x);var g=gapInline(x,byNum,mk);for(var k in g.used)used[k]=1;return g.html;}
 function flush(){
  if(!buf.length)return;
  var w=buf.reduce(function(a,r){return Math.max(a,r.length);},0);
  if(buf.length>1&&buf[0].length===w-1&&buf.slice(1).every(function(r){return r.length===w;}))buf[0]=[''].concat(buf[0]);   // header row missing its blank first cell
  var head=buf.length>1&&!/\d{1,2}\s*\)?\s*(?:[\.…_]{3,}|…)/.test(buf[0].join(' '))&&buf[0].every(function(x,i){return (i===0&&!x)||(x&&x.length<40);});
  out+='<div class="il-nt-wrap"><table class="il-nt">'+buf.map(function(r,ri){
   if(/^[\s:\-|]+$/.test(r.join(''))&&r.join('').indexOf('-')>=0)return '';
   var tag=head&&ri===0?'th':'td',h='';for(var i=0;i<w;i++)h+='<'+tag+'>'+cell(r[i]||'')+'</'+tag+'>';return '<tr>'+h+'</tr>';}).join('')+'</table></div>';buf=[];
 }
 var plain=[];
 function flushText(){if(!plain.length)return;
  out+=plain.map(function(ln){var t=ln.trim();var im=/^\[image\s+(\d+)\]$/i.exec(t);if(im)return imgBlock(im[1]);if(t==='[[WORDBANK]]')return BANK_HTML;
   if(mk&&t&&INSTR.test(t)&&t.length<220&&!/\d{1,2}\s*\)?\s*(?:[\.…_]{3,}|…)/.test(t)){sawInstr=true;return '<span class="gt-instr">'+cell(ln)+'</span>';}
   if(mk&&sawInstr&&!titled&&t&&t.length<90&&!/[\.…_:]$/.test(t)&&!/\d{1,2}\s*\)?\s*(?:[\.…_]{3,}|…)/.test(t)&&!/^[•\-\*]/.test(t)){titled=true;return '<span class="gt-title">'+cell(ln)+'</span>';}
   if(mk&&FLOW_MODE&&sawInstr&&t){if(/^[↓↑⇓⇩⬇↡]\uFE0F?$/.test(t))return '<div class="flow-arrow" aria-hidden="true">↓</div>';return '<div class="flow-line">'+cell(ln)+'</div>';}
   return cell(ln)+'\n';}).map(function(x,k,arr){return x;}).join('').replace(/\n$/,'');plain=[];}
 lines.forEach(function(l){var c=tableCells(l);if(c){flushText();buf.push(c);}else{flush();plain.push(l);}});
 flush();flushText();
 return{html:out,used:used};
}
function passageHtml(text){
 var t=String(text||''),m=/^\s*([^\n]{3,120})\n/.exec(t);
 if(m&&!/[\.!?:;,]$/.test(m[1].trim())&&!/^\s*[A-I]\s*$/.test(m[1])){return '<span class="pt-title">'+esc(m[1].trim())+'</span>'+richHtml(t.slice(m[0].length)).html;}

var IMG_AT=function(){return '';};
function imgBlock(k){return '<div class="il-fig">'+IMG_AT(+k)+'</div>';}
function splitImgMarks(text){var marks=[],keep=[];String(text||'').split('\n').forEach(function(l){var m=/^\s*\[image\s+(\d+)\]\s*$/i.exec(l);if(m)marks.push(+m[1]);else keep.push(l);});return{text:keep.join('\n'),marks:marks};}
function qrowTable(c,g,ctl){
 return '<table class="il-qt">'+g.qs.map(function(f){return '<tr id="q'+f.n+'"><td class="qn"><span class="il-qnum">'+f.num+'</span></td><td class="qt" data-hk="q'+f.n+'">'+esc(f.q.prompt)+'</td><td class="qa">'+ctl(f)+'</td><td class="qm">'+qmark(c,f)+'</td></tr>';}).join('')+'</table>';

function renderGroup(g,c){

 g.qs.forEach(function(f){byNum[f.num]=f;});
 function instrBlock(){if(!instr)return '';var sp=splitImgMarks(instr);return (sp.text.trim()?'<div class="il-instr" data-hk="i'+first.n+'">'+esc(sp.text)+'</div>':'')+sp.marks.map(imgBlock).join('');}
 // gap-fill: the text itself carries the numbered blanks, so the controls sit inside it
 if(instr&&/(?:[\.…_]{3,}|…)/.test(instr)){
  FLOW_MODE=/flow-?\s?chart/i.test(instr);
  var ex=extractWordBank(instr),wl=(first.q.options&&first.q.options.length>=2)?first.q.options.map(function(t,i){return{l:letterOf(i),t:t};}):ex.pairs,shown=instr;
  if(wl.length>=2){shown=ex.pairs.length>=2?ex.text:instr+'\n[[WORDBANK]]';
   BANK_HTML='<div class="il-wordbank" role="group" aria-label="List of words"><div class="wb-grid">'+wl.map(function(w){return '<div class="wb-item"><b>'+esc(w.l)+'</b><span>'+esc(w.t)+'</span></div>';}).join('')+'</div></div>';}
  else BANK_HTML='';
  var gi=richHtml(shown,byNum,function(f){var o=f.q.options||[];
   var ctl=wl.length>=2?letterSel(c,f,wl,o):(o.length?selCtl(c,f,o,' gap-sel'):txtCtl(c,f,'gap-in','…'));
   return '<span class="gap-wrap" id="q'+f.n+'"><b class="gap-n">'+f.num+'</b>'+ctl+qmark(c,f)+'</span>';});
  if(Object.keys(gi.used).length>=Math.max(1,g.qs.length-1)){

  }
 }

  return '<div class="il-group">'+instrBlock()+qrowTable(c,g,function(f){return selCtl(c,f,qOptions(f.q),' il-sel-fixed');})+'</div>';

  var panel=(opts.length&&!letters)?'<aside class="mg-opts"><div class="mg-title">'+esc(first.q.optTitle||(t==='matching-headings'?'List of Headings':'Options'))+'</div>'+opts.map(function(o,oi){var lab=t==='matching-headings'?'':'<b>'+letterOf(oi)+'</b>';return '<div class="mg-opt">'+lab+'<span>'+esc(o)+'</span></div>';}).join('')+'</aside>':(letters?'<div class="il-note mg-hint">Choose from '+esc(opts[0])+'–'+esc(opts[opts.length-1])+'.</div>':'');
  return '<div class="il-group">'+instrBlock()+'<div class="mg'+(panel&&!letters?' mg-two':'')+'"><div class="mg-q">'+qrowTable(c,g,function(f){return txtCtl(c,f,'il-ans mt-in','');})+'</div>'+panel+'</div></div>';
 }
 if(t==='plan-map-diagram-labelling'||t==='diagram-completion'){
  var lo=(first.q.options||[]),lletters=lo.length&&lo.every(function(o){return /^[A-I]$/.test(o);});

 }
 if(t==='multiple-choice'){
  var same=g.qs.length>1&&g.qs.every(function(f){return f.q.prompt===first.q.prompt&&(f.q.options||[]).join('|')===(first.q.options||[]).join('|');});
  if(same){
   var mo=first.q.options||[];
   return '<div class="il-group">'+instrBlock()+'<div class="il-q"><div class="il-qprompt" data-hk="q'+first.n+'">'+esc(first.q.prompt)+'</div><div class="il-opts il-opts-check" role="group" aria-label="Choose '+g.qs.length+' answers">'+mo.map(function(o,oi){var v=optValue(first.q,o,oi),chosen=g.qs.some(function(f){return (c.r.answers[f.n-1]||'')===v;});return '<label class="il-opt il-opt-check"><input type="checkbox" data-mc="'+g.qs.map(function(f){return f.n-1;}).join(',')+'" value="'+esc(v)+'"'+(chosen?' checked':'')+c.dis+'> <span>'+esc(optText(first.q,o,oi))+'</span></label>';}).join('')+'</div><div class="il-multi-marks">'+g.qs.map(function(f){return '<span class="il-multi-m" id="q'+f.n+'"><span class="il-qnum">'+f.num+'</span>'+qmark(c,f)+'</span>';}).join('')+'</div></div></div>';
  }
  return '<div class="il-group">'+instrBlock()+g.qs.map(function(f){
   var q=f.q,opts=qOptions(q),i=f.n-1,val=c.r.answers[i]||'',inp;
   if(opts.length&&opts.length<=8)inp='<div class="il-opts">'+opts.map(function(o,oi){var v=optValue(q,o,oi);return '<label class="il-opt"><input type="radio" name="q'+i+'" data-q="'+i+'" value="'+esc(v)+'"'+(val===v?' checked':'')+c.dis+'> <span data-hk="o'+f.n+'_'+oi+'">'+esc(optText(q,o,oi))+'</span></label>';}).join('')+'</div>';

/* highlighter: select text in the passage or the questions, then pick a colour */
function hlBar(){
 var b=document.getElementById('hlBar');if(b)return b;
 b=document.createElement('div');b.id='hlBar';b.className='hl-bar';
 b.innerHTML='<button data-c="yellow" class="hl-y" title="Yellow">A</button><button data-c="green" class="hl-g" title="Green">A</button><button data-c="pink" class="hl-p" title="Pink">A</button><button data-c="blue" class="hl-b" title="Blue">A</button><button data-c="orange" class="hl-o" title="Orange">A</button><button data-c="clear" class="hl-x" title="Clear highlight">Clear</button>';
 document.body.appendChild(b);
 b.addEventListener('mousedown',function(e){e.preventDefault();});
 b.addEventListener('click',function(e){var btn=e.target.closest('button');if(!btn)return;applyHighlight(btn.getAttribute('data-c'));});
 return b;
}
var hlCtx=null;
function onHighlightSelect(e){
 var bar=hlBar(),sel=window.getSelection();
 var mk=e&&e.target&&e.target.closest?e.target.closest('mark.hl'):null;
 if(sel&&!sel.isCollapsed&&sel.rangeCount){
  var range=sel.getRangeAt(0),a=range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentNode,c=a&&a.closest?a.closest('[data-hk]'):null;
  if(c&&c.contains(range.endContainer)){hlCtx={range:range.cloneRange(),box:c};var rc=range.getBoundingClientRect();bar.style.display='flex';bar.style.left=Math.max(8,Math.min(window.innerWidth-300,rc.left+rc.width/2-140))+'px';bar.style.top=Math.max(8,rc.top-48)+'px';return;}
 }
 if(mk){var box=mk.closest('[data-hk]'),rg=document.createRange();rg.selectNodeContents(mk);hlCtx={range:rg,box:box,mark:mk};var r2=mk.getBoundingClientRect();bar.style.display='flex';bar.style.left=Math.max(8,Math.min(window.innerWidth-300,r2.left))+'px';bar.style.top=Math.max(8,r2.top-48)+'px';return;}
 bar.style.display='none';hlCtx=null;
}
function applyHighlight(c){
 if(!hlCtx)return;var box=hlCtx.box,range=hlCtx.range;
 if(c==='clear'){
  qa('[data-hk="'+box.getAttribute('data-hk')+'"] mark.hl').forEach(function(m){if(m===hlCtx.mark||range.intersectsNode(m)){var p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m);p.normalize();}});
 }else{
  var m=document.createElement('mark');m.className='hl hl-'+c;
  try{range.surroundContents(m);}catch(e){m.appendChild(range.extractContents());range.insertNode(m);}
 }
 state.run.hl[box.getAttribute('data-hk')]=box.innerHTML;
 var s=window.getSelection();if(s)s.removeAllRanges();
 document.getElementById('hlBar').style.display='none';hlCtx=null;
}

function buildTelemetry(x,r,flat){
 return{totalSec:Math.round((Date.now()-r.startedMs)/1000),partSec:(x.sections||[]).map(function(s,p){return Math.round((r.partMs[p]||0)/1000);}),hidden:r.hidden,
  per:flat.map(function(f,i){return{n:f.n,num:f.num,part:f.part+1,type:f.q.type||'short-answer',sec:Math.round((r.qMs[i]||0)/1000),changes:r.qChanges[i]||0,firstAtSec:r.qFirst[i]!=null?Math.round(r.qFirst[i]/1000):null};})};
}
function submitAttempt(force){
 var x=state.active,r=state.run,flat=flatQs(x);if(isPrev())return;syncVisible();
 var blanks=flat.filter(function(f,i){return !filled(r.answers[i]);}).length;
 if(force===true)return submitNow();
 VM.confirm(blanks?blanks+' question'+(blanks===1?' is':'s are')+' unanswered. Submit anyway?':'Submit your answers?',{title:'Submit your test',ok:'Submit'}).then(function(y){if(y)submitNow();});
}
function submitNow(){
 var x=state.active,r=state.run,flat=flatQs(x);

 var answers=flat.map(function(f,i){return r.answers[i]||'';});
 qa('.exam-submit').forEach(function(b){b.disabled=true;});
 call('ielts.attempt.save',{contentIds:String(x.id||x._id).split(','),assignmentId:state.assignment?state.assignment.id:'',taskType:x.taskType||'',answers:answers,startedAt:state.started}).then(function(a){
  stopTimer();state.attempts.push(a);
  var tel=buildTelemetry(x,r,flat);
  r.answers=(a.responses||[]).map(function(z){return z.answer;});
  state.review={attempt:a,tel:tel};r.part=0;
  renderPractice();window.scrollTo(0,0);
  VM.toast('Submitted · practice score '+(a.score===null?'not available (no answer key)':a.score+'%'),'ok');
  runAnalysis();

}

/* ───────── Review: local insights from what the student did while working ───────── */
function insightsOf(x,a,tel){
 var flat=flatQs(x),resp=a.responses||[],byType={},byPart=[],wrong=[],blank=[],changedRight=0,changedWrong=0;
 flat.forEach(function(f,i){var rr=resp[i]||{},t=f.q.type||'short-answer',bt=byType[t]||(byType[t]={ok:0,n:0}),bp=byPart[f.part]||(byPart[f.part]={ok:0,n:0});
  if(!filled(rr.answer))blank.push(f.num);
  if(rr.correct===null||rr.correct===undefined)return;
  bt.n++;bp.n++;if(rr.correct){bt.ok++;bp.ok++;}else wrong.push(f.num);
  if(tel.per[i]&&tel.per[i].changes>0){if(rr.correct)changedRight++;else changedWrong++;}});
 var slow=tel.per.filter(function(z){var rr=resp[z.n-1];return rr&&rr.correct===false&&z.sec>0;}).sort(function(a1,b1){return b1.sec-a1.sec;}).slice(0,3);
 return{byType:byType,byPart:byPart,wrong:wrong,blank:blank,changedRight:changedRight,changedWrong:changedWrong,slow:slow,avg:flat.length?tel.totalSec/flat.length:0};
}
function drawReview(){
 var x=state.active,rv=state.review,a=rv.attempt,tel=rv.tel,ins=insightsOf(x,a,tel);

 if(keys.provider==='groq')return fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+keys.key},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:prompt}],temperature:0.3})}).then(function(r){if(!r.ok)throw new Error('AI provider error ('+r.status+'). Check your key in AI settings.');return r.json();}).then(function(d){return d.choices[0].message.content;});

 function next(i){if(i>=models.length)return Promise.reject(last||new Error('The AI did not respond.'));
  return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+models[i]+':generateContent?key='+encodeURIComponent(keys.key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.3}})}).then(function(r){
   if(r.status===400||r.status===401||r.status===403)throw Object.assign(new Error('The AI key is not valid ('+r.status+'). Check it in AI settings.'),{fatal:true});
   if(!r.ok)throw new Error('AI provider error ('+r.status+').');return r.json();}).then(function(d){return d.candidates[0].content.parts.map(function(p){return p.text||'';}).join('');}).catch(function(e){if(e.fatal)throw e;last=e;return next(i+1);});}
 return next(0);
}

  if(ib)ib.innerHTML=(r.images||[]).length?'<div class="il-note">Images found on the page (kept with this '+partWord(skill).toLowerCase()+'). Remove any that do not belong:</div><div class="ed-thumbs">'+r.images.map(function(u,k){return '<span class="ed-thumb"><img src="'+esc(u)+'" alt="" referrerpolicy="no-referrer"><button type="button" class="ed-x" data-rmimg="'+i+'|'+k+'" title="Remove">×</button></span>';}).join('')+'</div>':'';
  var det=document.getElementById('det'+i);
  if(det)det.innerHTML=r.questions.length?'<div class="il-note">Detected <b>'+r.questions.length+'</b> question'+(r.questions.length===1?'':'s')+' in '+instr+' group'+(instr===1?'':'s')+': '+Object.keys(counts).map(function(t){return esc(typeName(t))+' × '+counts[t];}).join(' · ')+' <button type="button" class="vm-btn vm-btn-ghost vm-btn-sm" data-redetect="'+i+'" title="Forget manually chosen task types and detect them again">↻ Re-detect task types</button></div>':'<div class="il-note">No questions detected yet. Paste the full question section.</div>';
  var list=document.getElementById('ans'+i);
  if(list)list.innerHTML=r.questions.length?r.questions.map(function(q,k){var key=qNum(q,k);return '<div class="il-arow"><span class="il-qnum">'+key+'</span><div class="il-aprompt">'+esc(q.prompt.slice(0,70))+'<select class="il-typesel" data-t="'+i+'|'+key+'">'+ALL_TYPES.map(function(t){return '<option value="'+t+'"'+(t===q.type?' selected':'')+'>'+esc(typeName(t))+'</option>';}).join('')+'</select></div><input class="vm-input" data-r="'+i+'" data-a="'+key+'" value="'+esc((r.ans[key]||[]).join(' / '))+'" placeholder="Answer"></div>';}).join(''):'<div class="il-note">Answer boxes appear once questions are detected.</div>';
 }
 function bind(){
  document.getElementById('edBack').onclick=function(){var dirty=ed.rows.some(function(r){return r.text.trim()||r.qtext.trim();});if(!ex&&dirty)VM.confirm('Discard what you have entered?',{danger:true,ok:'Discard'}).then(function(y){if(y)leave();});else leave();};
  document.getElementById('edSkill').onchange=function(){skill=this.value;ed.rows=[];ed.rows=[newRow(nextPart()||'1')];build();};
  document.getElementById('edBook').onchange=function(){book=this.value;updateHints();};
  document.getElementById('edTest').onchange=function(){test=this.value;updateHints();};
  var rowsEl=document.getElementById('edRows'),tmr={};
  rowsEl.addEventListener('input',function(e){var el=e.target,ri=el.getAttribute('data-r');if(ri===null)return;var r=ed.rows[+ri];
   if(el.hasAttribute('data-f')){var f=el.getAttribute('data-f');r[f]=el.value;if(f==='qtext'){clearTimeout(tmr[ri]);tmr[ri]=setTimeout(function(){recompute(+ri);},250);}}
   else if(el.hasAttribute('data-a'))r.ans[el.getAttribute('data-a')]=el.value.split('/').map(function(v){return v.trim();}).filter(Boolean);});
  rowsEl.addEventListener('change',function(e){var el=e.target;
   if(el.hasAttribute('data-t')){var a=el.getAttribute('data-t').split('|');ed.rows[+a[0]].types[a[1]]=el.value;recompute(+a[0]);}
   else if(el.hasAttribute('data-am')){var i=+el.getAttribute('data-am');ed.rows[i].audioMode=el.value;document.getElementById('amf'+i).style.display=el.value==='file'?'':'none';document.getElementById('aml'+i).style.display=el.value==='link'?'':'none';}
   else if(el.hasAttribute('data-af')){ed.rows[+el.getAttribute('data-af')].file=el.files&&el.files[0]||null;}});
  rowsEl.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
   if(b.hasAttribute('data-fill')){var i=+b.getAttribute('data-fill'),r=ed.rows[i],m=parseAnswers(document.getElementById('ap'+i).value),n=0;r.questions.forEach(function(q,k){var key=qNum(q,k);if(m[key]){r.ans[key]=m[key];n++;}});recompute(i);document.getElementById('edError').textContent=n?'':'None of the pasted answers matched the question numbers. Write one answer per line, starting with the question number, e.g. “1 weather”, “2. 10/ten”, “3 B”. For two answers to one item write “21&22 B, D”.';if(n)VM.toast('Filled '+n+' answers.','ok');}
   else if(b.hasAttribute('data-redetect')){var rdi=+b.getAttribute('data-redetect');ed.rows[rdi].types={};recompute(rdi);VM.toast('Task types detected again.','ok',2200);}
   else if(b.hasAttribute('data-rmimg')){var ra=b.getAttribute('data-rmimg').split('|');ed.rows[+ra[0]].images.splice(+ra[1],1);recompute(+ra[0]);}
   else if(b.hasAttribute('data-rm')){ed.rows.splice(+b.getAttribute('data-rm'),1);build();}});
  var add=document.getElementById('edAdd');if(add)add.onclick=function(){var p=nextPart();if(!p)return;var imp=init.imported&&init.imported.filter(function(s){return String(s.part)===String(p);})[0];ed.rows.push(newRow(p,imp));ed.rows.sort(function(a,b){return +a.part-+b.part;});build();};
  var ar=document.getElementById('edArchive');if(ar)ar.onclick=function(){VM.confirm('Remove this item from the Library? Past attempts are kept.',{danger:true,ok:'Remove'}).then(function(y){if(y)call('ielts.content.archive',{id:ex.id||ex._id}).then(function(){VM.toast('Removed from the Library.','ok');state.loaded=false;load();}).catch(function(e){say(e.message);});});};
  document.getElementById('edDone').onclick=done;
  document.getElementById('edPreview').onclick=preview;
 }
 function preview(){
  err('');
  var act=ed.rows.filter(function(r){return r.text.trim()||r.qtext.trim();});
  if(!act.length)return err('Add a passage and its questions first, then preview them.');
  var secs=act.map(function(r){
   var qs=r.questions.map(function(q,k){return{number:qNum(q,k),type:q.type,prompt:q.prompt,options:q.options||[],optTitle:q.optTitle||'',instruction:q.instruction||'',answers:[]};});
   var audio=r.audio;if(skill==='listening'){if(r.audioMode==='link'&&/^https?:\/\//i.test(r.audioUrl.trim()))audio={url:r.audioUrl.trim()};else if(r.audioMode==='file'&&r.file)audio={url:URL.createObjectURL(r.file)};}
   return{title:partWord(skill)+' '+r.part,part:r.part,text:skill==='reading'?r.text:'',script:r.script,images:(r.images||[]).filter(function(u){return /^https:\/\//i.test(u);}),questions:qs,audio:audio};});
  state.active={title:'Preview · '+(book||'Book')+' · Test '+(test||'?'),skill:skill,sections:secs};state.run=null;state.review=null;state.assignment=null;
  state.previewBack=function(){state.previewBack=null;state.active=null;state.run=null;setExam(false);build();window.scrollTo(0,0);};
  render();window.scrollTo(0,0);
 }
 function leave(){render();}
 function err(m){var e=document.getElementById('edError');e.textContent=m;if(m)e.scrollIntoView({block:'center'});}
 function done(){
  err('');
  if(!book||!test)return err('Book and Test are required.');
  var active=ed.rows.filter(function(r){return r.text.trim()||r.qtext.trim()||Object.keys(r.ans).length;});
  if(!active.length)return err('Add the content of at least one '+partWord(skill).toLowerCase()+'.');
  var payloads=[],problem='';
  function normT(t){return String(t||'').toLowerCase().replace(/[·•|:\-–—_,.]+/g,' ').replace(/\s+/g,' ').trim();}
  function titleOf(r){return (r.title||'').trim()||(book+' · Test '+test+' · '+partWord(skill)+' '+r.part);}
  var dupRow=null,dupItem=null;
  active.forEach(function(r){if(dupItem)return;var nt=normT(titleOf(r));var hit=state.items.filter(function(i){return (!ex||(i.id||i._id)!==(ex.id||ex._id))&&(normT(i.title)===nt||(i.skill===skill&&i.book===book&&String(i.test)===String(test)&&String(i.part)===String(r.part)));})[0];if(hit){dupRow=r;dupItem=hit;}});
  if(dupItem){
   VM.confirm('“'+dupItem.title+'” is already in the Library, so there is no need to add it again. Open the Library and start practising it now.',{title:'This practice already exists',ok:'Go to Library',cancel:'Stay here',icon:'✓'}).then(function(y){if(y){state.libSkill=skill;state.bookFilter='';leave();}});
   return;
  }
  active.forEach(function(r){
   if(problem)return;var L=partWord(skill)+' '+r.part+': ';
   if(taken(r.part))return problem=L+'already exists in the Library for this book and test.';
   if(skill==='reading'&&!r.text.trim())return problem=L+'the passage text is missing.';
   if(!r.questions.length)return problem=L+'no questions were detected. Paste the full question section.';
   var missing=[];
   var questions=r.questions.map(function(q,k){var key=qNum(q,k),a=(r.ans[key]||[]).filter(Boolean);if(!a.length)missing.push(key);return{number:key,type:q.type,prompt:q.prompt,options:q.options||[],optTitle:q.optTitle||'',instruction:q.instruction||'',answers:a};});
   if(missing.length){
    var first=missing[0],fq=r.questions.filter(function(q,k){return qNum(q,k)===first;})[0]||{},snip=String(fq.prompt||'').replace(/_{2,}/g,'…').slice(0,60);
    return problem=L+'no answer for question'+(missing.length>1?'s ':' ')+missing.join(', ')+'.'+(snip?' (Question '+first+': “'+snip+'”)':'')+' Fix it in the Answers box: write one answer per line, number first, e.g. “'+first+' ten/10”. Use “/” between accepted alternatives. If the answer is a number, add a dot or write it as “'+first+'. 10”, then click Fill.';
   }
   var audio=r.audio;
   if(skill==='listening'){
    if(r.audioMode==='link'){var u=r.audioUrl.trim();if(u&&!/^https?:\/\//i.test(u))return problem=L+'the audio link must start with http:// or https://.';audio=u?{url:u}:undefined;}
    else if(!(r.audio&&r.audio.path))audio=undefined;
   }
   payloads.push({row:r,body:{id:ex?(ex.id||ex._id):undefined,title:(r.title||'').trim()||(book+' · Test '+test+' · '+partWord(skill)+' '+r.part),skill:skill,book:book,test:test,part:r.part,sourceUrl:init.sourceUrl||(ex&&ex.sourceUrl)||'',sourceTitle:init.sourceTitle||(ex&&ex.sourceTitle)||'',attribution:(ex&&ex.attribution)||'',
    sections:[{title:partWord(skill)+' '+r.part,part:r.part,images:(r.images||[]).filter(function(u){return /^https:\/\//i.test(u);}).slice(0,6),text:skill==='reading'?r.text:'',script:skill==='listening'?r.script:'',questionsText:r.qtext,questions:questions,audio:audio}]}});
  });
  if(problem)return err(problem);
  var btn=document.getElementById('edDone');btn.disabled=true;
  busy('Saving to the Library…');
  var saved=0,warn='';
  payloads.reduce(function(p,pl){return p.then(function(){
   return call('ielts.content.save',pl.body).then(function(res){saved++;
    if(skill==='listening'&&pl.row.audioMode==='file'&&pl.row.file)return call('ielts.audio.upload',{contentId:res.id,file:pl.row.file}).then(function(up){return call('ielts.audio.attach',{contentId:res.id,audioPath:up.path,fileName:up.fileName,contentType:up.contentType,size:up.size});}).catch(function(e){warn=' Audio upload failed ('+e.message+'). Paste an audio link instead.';});});
  });},Promise.resolve()).then(function(){
   unbusy();VM.toast('Added '+saved+' '+partWord(skill).toLowerCase()+(saved===1?'':'s')+' to the Library.'+(teacher?'':' It is open for practice right away.')+warn,warn?'warn':'ok',warn?7000:2600);
   state.libSkill=skill;state.libMode='tests';state.bookFilter='';state.loaded=false;if(init.after==='inclass')location.hash='#inclass';load();
  }).catch(function(e){unbusy();btn.disabled=false;err((saved?saved+' saved. ':'')+e.message);});
 }
 build();window.scrollTo(0,0);
}

function teacherReports(){call('ielts.report.list').then(function(rows){document.getElementById('extra').innerHTML='<div class="il-panel" style="margin-top:16px"><h3>Student reports</h3><div style="overflow:auto"><table class="vm-table"><thead><tr><th>Student</th><th>Lesson</th><th>Question</th><th>Report</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(rows.length?rows.map(function(r){return '<tr><td>'+esc(r.studentName)+'</td><td>'+esc(r.contentTitle)+'</td><td>'+esc(r.questionNumber||'—')+'</td><td>'+esc(r.message)+'</td><td>'+esc(r.status)+'</td><td><button class="vm-btn vm-btn-sm" data-resolve="'+esc(r.id||r._id)+'">Mark resolved</button></td></tr>';}).join(''):'<tr><td colspan="6">No reports.</td></tr>')+'</tbody></table></div></div>';Array.from(document.querySelectorAll('[data-resolve]')).forEach(function(b){b.onclick=function(){call('ielts.report.update',{id:b.dataset.resolve,status:'resolved'}).then(teacherReports).catch(function(e){say(e.message);});};});}).catch(function(e){say(e.message);});}function drawChart(el,rows){rows=rows.filter(function(r){return typeof r.score==='number'&&isFinite(r.score);});if(!rows.length)return;var w=700,h=210,p=28;var pts=rows.map(function(r,i){return [p+(rows.length<2?0:i*(w-2*p)/(rows.length-1)),h-p-r.score*(h-2*p)/100];});var line=pts.map(function(a){return a.join(',');}).join(' ');el.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" class="il-chart" role="img" aria-label="Practice score over time"><line x1="'+p+'" y1="'+(h-p)+'" x2="'+(w-p)+'" y2="'+(h-p)+'" stroke="#9ca3af"/><line x1="'+p+'" y1="'+p+'" x2="'+p+'" y2="'+(h-p)+'" stroke="#9ca3af"/><text x="4" y="'+(p+4)+'" font-size="12">100</text><text x="12" y="'+(h-p)+'" font-size="12">0</text><polyline fill="none" stroke="#2A7BA3" stroke-width="3" points="'+line+'"/>'+pts.map(function(a,i){return '<circle cx="'+a[0]+'" cy="'+a[1]+'" r="4" fill="#2A7BA3"><title>'+rows[i].score+'% · '+esc(rows[i].title)+'</title></circle>';}).join('')+'</svg>';}
function studentResults(){var rows=state.attempts.slice(-50);document.getElementById('extra').innerHTML='<div class="il-panel" style="margin-top:16px"><h3>My practice results</h3><div class="il-toolbar"><select id="rsSkill" class="vm-select"><option value="all">Reading & Listening</option><option value="reading">Reading</option><option value="listening">Listening</option></select><label>From <input id="rsDate" type="date" class="vm-input"></label></div><div id="chart"></div><p id="empty" class="il-empty" style="display:none">Complete an attempt to see progress here.</p><div style="overflow:auto"><table class="vm-table"><thead><tr><th>Lesson</th><th>Skill</th><th>Score (practice)</th><th>Questions correct</th><th>Time</th><th>Date</th><th>Feedback</th></tr></thead><tbody id="history"></tbody></table></div></div>';function refresh(){var skill=document.getElementById('rsSkill').value,since=document.getElementById('rsDate').value;var r=rows.filter(function(a){return(skill==='all'||a.skill===skill)&&(!since||a.completedAt.slice(0,10)>=since);});var e=document.getElementById('empty');e.style.display=r.length?'none':'block';document.getElementById('chart').innerHTML='';if(r.length)drawChart(document.getElementById('chart'),r);document.getElementById('history').innerHTML=r.slice().reverse().map(function(a){return '<tr><td>'+esc(a.title)+'</td><td>'+esc(a.skill)+'</td><td>'+(a.score===null?'Not scored · answer key pending':a.score+'%')+'</td><td>'+a.correct+'/'+a.gradedCount+' scored ('+a.total+' total)'+'</td><td>'+Math.round(a.durationSeconds/60)+' min</td><td>'+new Date(a.completedAt).toLocaleDateString()+'</td><td>'+(docUrlOk(a.feedbackDocUrl)?'<a href="'+esc(a.feedbackDocUrl)+'" target="_blank" rel="noopener">Open doc</a>':'')+'</td></tr>';}).join('');}document.getElementById('rsSkill').onchange=refresh;document.getElementById('rsDate').onchange=refresh;refresh();}
function teacherResults(){document.getElementById('extra').innerHTML='<div class="il-panel" style="margin-top:16px"><h3>Class results</h3><div class="il-toolbar"><select class="vm-select" id="trClass"><option value="">Select a class</option>'+state.classes.map(function(c){return '<option value="'+esc(c.classId)+'">'+esc(c.className)+'</option>';}).join('')+'</select><select class="vm-select" id="trSkill"><option value="all">All skills</option><option value="reading">Reading</option><option value="listening">Listening</option></select><select class="vm-select" id="trStudent"><option value="all">All students</option></select><select class="vm-select" id="trItem"><option value="all">All lessons</option></select><select class="vm-select" id="trPeriod" aria-label="Period"><option value="7">Last 7 days</option><option value="14">Last 2 weeks</option><option value="21">Last 3 weeks</option><option value="0">All time</option></select></div><div id="trChart"></div><div style="overflow:auto"><table class="vm-table"><thead><tr><th>Student</th><th>Lesson</th><th>Skill</th><th>Practice score</th><th>Time</th><th>Completed</th><th>Feedback</th></tr></thead><tbody id="trRows"></tbody></table></div></div>';var rows=[];function refresh(){var cls=document.getElementById('trClass').value;if(!cls){document.getElementById('trRows').innerHTML='<tr><td colspan="7">Choose a class to view results.</td></tr>';document.getElementById('trChart').innerHTML='';return;}var pd=+document.getElementById('trPeriod').value,sinceIso=pd?new Date(Date.now()-pd*86400000).toISOString():'';call('ielts.attempt.list',{classId:cls,since:sinceIso}).then(function(data){rows=data||[];var students=Array.from(new Set(rows.map(function(a){return a.studentId;})));var items=Array.from(new Set(rows.map(function(a){return a.contentId;})));document.getElementById('trStudent').innerHTML='<option value="all">All students</option>'+students.map(function(id){var a=rows.find(function(r){return r.studentId===id;});return '<option value="'+esc(id)+'">'+esc(a.studentName||id)+'</option>';}).join('');document.getElementById('trItem').innerHTML='<option value="all">All lessons</option>'+items.map(function(id){var a=rows.find(function(r){return r.contentId===id;});return '<option value="'+esc(id)+'">'+esc(a.title)+'</option>';}).join('');filter();}).catch(function(e){say(e.message);});}function filter(){var skill=document.getElementById('trSkill').value,student=document.getElementById('trStudent').value,item=document.getElementById('trItem').value,since='';var r=rows.filter(function(a){return(skill==='all'||a.skill===skill)&&(student==='all'||a.studentId===student)&&(item==='all'||a.contentId===item)&&(!since||a.completedAt.slice(0,10)>=since);});document.getElementById('trChart').innerHTML='';if(r.length)drawChart(document.getElementById('trChart'),r);document.getElementById('trRows').innerHTML=r.slice().reverse().map(function(a){return '<tr><td>'+esc(a.studentName)+'</td><td>'+esc(a.title)+'</td><td>'+esc(a.skill)+'</td><td>'+(a.score===null?'Not scored · answer key pending':a.score+'%')+' · '+a.correct+'/'+a.gradedCount+' scored</td><td>'+Math.round(a.durationSeconds/60)+' min</td><td>'+new Date(a.completedAt).toLocaleString()+'</td><td>'+(docUrlOk(a.feedbackDocUrl)?'<a href="'+esc(a.feedbackDocUrl)+'" target="_blank" rel="noopener">📄 Open doc</a>':'<span class="il-note">—</span>')+'</td></tr>';}).join('')||'<tr><td colspan="7">No attempts for these filters.</td></tr>';}document.getElementById('trClass').onchange=refresh;['trSkill','trStudent','trItem'].forEach(function(id){document.getElementById(id).onchange=filter;});document.getElementById('trPeriod').onchange=refresh;}

function load(){root().innerHTML='<div class="il-empty">Đang tải…</div>';var second=teacher?call('class.list'):call('ielts.attempt.list');Promise.all([call('ielts.content.list'),second]).then(function(v){state.items=v[0]||[];if(teacher)state.classes=v[1]||[];else state.attempts=v[1]||[];draw();}).catch(function(e){root().innerHTML='<div class="il-empty">'+esc(e.message)+'</div>';});}

function drawStudent(){if(state.filter==='all')return chooseSkill();var items=state.items.filter(function(x){return x.status==='published'||x.visibility==='private';});root().innerHTML='<div class="ielts-wrap"><div class="ielts-hero"><h2>Reading & Listening practice</h2><p>Practice published Reading and Listening tests, or create a draft to contribute to your class library.</p></div><div class="il-toolbar"><button class="vm-btn vm-btn-ghost" id="backSkill">← Đổi kỹ năng</button><select class="vm-select" id="skill"><option value="reading">Reading</option><option value="listening">Listening</option></select><select class="vm-select" id="task"><option value="all">All task types</option>'+taskOptions()+'</select><button class="vm-btn vm-btn-primary" id="full">Full Test · 3 sections</button><button class="vm-btn vm-btn-ghost" id="free">＋ Free practice</button><button class="vm-btn vm-btn-ghost" id="results">My results</button><button class="vm-btn vm-btn-ghost" id="aiSettings">AI settings</button></div><div class="il-grid" id="cards"></div><div id="extra"></div></div>';document.getElementById('skill').value=state.filter;document.getElementById('backSkill').onclick=function(){state.filter='all';draw();};function cards(){var skill=document.getElementById('skill').value,task=document.getElementById('task').value;var rows=items.filter(function(x){return(skill==='all'||x.skill===skill)&&(task==='all'||(x.taskTypes||[]).indexOf(task)>=0);});document.getElementById('cards').innerHTML=rows.length?rows.map(function(x){return '<article class="il-card"><span class="il-badge">'+esc(x.skill)+'</span><h3>'+esc(titleItem(x))+'</h3><div class="il-meta">'+(x.sections||[]).length+' section(s) · '+(x.sections||[]).reduce(function(n,s){return n+(s.questions||[]).length;},0)+' questions'+(x.status==='published'?' · Published':(x.status==='review'?' · Chờ kiểm tra':' · Private'))+'</div><div class="il-meta">'+esc((x.taskTypes||[]).join(' · '))+'</div><button class="vm-btn vm-btn-primary" data-open="'+esc(x.id||x._id)+'">Start practice</button></article>';}).join(''):'<div class="il-empty">No lessons match these filters yet.</div>';Array.from(document.querySelectorAll('[data-open]')).forEach(function(b){b.onclick=function(){call('ielts.content.get',{id:b.dataset.open}).then(function(x){state.active=x;state.run=null;state.review=null;state.started=new Date().toISOString();draw();}).catch(function(e){say(e.message);});};});}document.getElementById('skill').onchange=function(){state.filter=this.value;cards();};document.getElementById('task').onchange=cards;cards();document.getElementById('full').onclick=function(){var skill=document.getElementById('skill').value;if(skill==='all')skill='reading';var candidates=items.filter(function(x){return (x.status==='published'||x.status==='review')&&x.skill===skill;});if(candidates.length<3){say('Cần ít nhất ba bài đã publish cùng skill để tạo Full Test.');return;}var chosen=candidates.slice(0,3),combined={id:chosen.map(function(x){return x.id||x._id;}).join(','),title:'Full Test · '+skill,skill:skill,visibility:'library',version:1,taskTypes:Array.from(new Set([].concat.apply([],chosen.map(function(x){return x.taskTypes||[];})))),sections:chosen.reduce(function(a,x){return a.concat(x.sections||[]);},[])};state.active=combined;state.run=null;state.review=null;state.started=new Date().toISOString();draw();};document.getElementById('free').onclick=function(){editorDialog(true);};document.getElementById('results').onclick=studentResults;document.getElementById('aiSettings').onclick=aiSettings;}

var timerId=null,visBound=false;
var ALL_TYPES=['multiple-choice','true-false-not-given','sentence-completion','summary-completion','short-answer','matching-headings','matching-features','matching','diagram-completion','plan-map-diagram-labelling','form-note-table-flow-chart-summary-completion'];

function qa(sel){return Array.from(document.querySelectorAll(sel));}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function secLabel(x,i){return (x.skill==='listening'?'Part ':'Passage ')+(i+1);}
function flatQs(x){var out=[];(x.sections||[]).forEach(function(s,p){(s.questions||[]).forEach(function(q,k){out.push({q:q,part:p,k:k,n:out.length+1});});});return out;}
function partRange(flat,p){var a=flat.filter(function(f){return f.part===p;});return a.length?{from:a[0].n,to:a[a.length-1].n,count:a.length}:{from:0,to:0,count:0};}

function optText(q,o,i){if(q.type==='true-false-not-given'||/^[A-H][.)]\s/.test(o))return o;return String.fromCharCode(65+i)+'. '+o;}

function newRun(x){return{forItem:x,part:0,answers:[],committed:{},qMs:{},qChanges:{},qFirst:{},partMs:[],partSince:Date.now(),startedMs:Date.now(),focusQ:-1,focusSince:0,hidden:0};}

function renderPractice(){

  (rv?'<div id="reviewBanner"></div>':'')+

  (rv?'<div id="insights"></div><div class="il-panel" id="aiBox"><h3>Nhận xét của AI</h3><div id="aiFeedback" class="il-ai-output"></div><div class="il-row" style="margin-top:10px"><button class="vm-btn vm-btn-ghost" id="aiAgain">Phân tích lại</button><button class="vm-btn vm-btn-ghost" id="openAiSettings">AI settings</button></div></div>':'')+
  '<section class="il-answer-key" id="answerKey"></section><div id="extra"></div></div>';

 if(listen){var withAudio=secs.filter(function(s){return s.audio&&s.audio.path;})[0],bar=document.getElementById('audioBar');
  if(withAudio){bar.innerHTML='<audio controls preload="none" id="audioEl" style="width:100%"></audio>';call('ielts.audio.url',{path:withAudio.audio.path}).then(function(url){var a=document.getElementById('audioEl');if(a)a.src=url;}).catch(function(e){bar.innerHTML='<span class="il-note">Không tải được audio: '+esc(e.message)+'</span>';});}
  else bar.innerHTML='<span class="il-note">Đề này chưa có file audio. Hãy nghe theo hướng dẫn của giáo viên.</span>';}

 document.getElementById('exit').onclick=function(){if(!rv&&answeredCount()&&!confirm('Thoát và bỏ bài đang làm?'))return;stopTimer();state.active=null;state.run=null;state.review=null;draw();};
 document.getElementById('report').onclick=function(){var n=prompt('Số câu bị lỗi (có thể bỏ trống):'),message=prompt('Mô tả lỗi để giáo viên chỉnh:');if(!message)return;call('ielts.report.create',{contentId:String(x.id||x._id).split(',')[0],contentTitle:titleItem(x),questionNumber:n,message:message,privateContent:x.visibility==='private'}).then(function(){VM.toast('Đã gửi báo lỗi cho giáo viên.','success');}).catch(function(e){say(e.message);});};

function drawTabs(){

  return '<button class="il-tab'+(p===r.part?' active':'')+'" data-part="'+p+'">'+esc(secLabel(x,p))+'<small>'+(rv?ok+'/'+rg.count+' đúng':done+'/'+rg.count+' đã làm')+'</small></button>';}).join('');

}

function buildTelemetry(x,r,flat){
 return{totalSec:Math.round((Date.now()-r.startedMs)/1000),partSec:(x.sections||[]).map(function(s,p){return Math.round((r.partMs[p]||0)/1000);}),hidden:r.hidden,
  per:flat.map(function(f,i){return{n:f.n,part:f.part+1,type:f.q.type||'short-answer',sec:Math.round((r.qMs[i]||0)/1000),changes:r.qChanges[i]||0,firstAtSec:r.qFirst[i]!=null?Math.round(r.qFirst[i]/1000):null};})};
}

function submitAttempt(){
 var x=state.active,r=state.run,flat=flatQs(x);syncVisible();
 var blanks=flat.filter(function(f,i){return !filled(r.answers[i]);}).length;
 if(!confirm(blanks?'Còn '+blanks+' câu chưa trả lời. Vẫn nộp bài?':'Nộp bài?'))return;
 flushTiming();
 var answers=flat.map(function(f,i){return r.answers[i]||'';});
 qa('.il-submit').forEach(function(b){b.disabled=true;});
 call('ielts.attempt.save',{contentIds:String(x.id||x._id).split(','),answers:answers,startedAt:state.started}).then(function(a){
  stopTimer();state.attempts.push(a);
  var tel=buildTelemetry(x,r,flat);
  r.answers=(a.responses||[]).map(function(z){return z.answer;});
  state.review={attempt:a,tel:tel};r.part=0;
  renderPractice();window.scrollTo(0,0);
  VM.toast('Đã nộp bài · điểm luyện tập '+(a.score===null?'chưa có đáp án':a.score+'%'),'success');
  runAnalysis();
 }).catch(function(e){qa('.il-submit').forEach(function(b){b.disabled=false;});say(e.message);});
}

/* ───────── Review: local insights from what the student did while working ───────── */
function insightsOf(x,a,tel){
 var flat=flatQs(x),resp=a.responses||[],byType={},byPart=[],wrong=[],blank=[],changedRight=0,changedWrong=0;
 flat.forEach(function(f,i){var rr=resp[i]||{},t=f.q.type||'short-answer',bt=byType[t]||(byType[t]={ok:0,n:0}),bp=byPart[f.part]||(byPart[f.part]={ok:0,n:0});
  if(!filled(rr.answer))blank.push(f.n);
  if(rr.correct===null||rr.correct===undefined)return;
  bt.n++;bp.n++;if(rr.correct){bt.ok++;bp.ok++;}else wrong.push(f.n);
  if(tel.per[i]&&tel.per[i].changes>0){if(rr.correct)changedRight++;else changedWrong++;}});
 var slow=tel.per.filter(function(z){var rr=resp[z.n-1];return rr&&rr.correct===false&&z.sec>0;}).sort(function(a1,b1){return b1.sec-a1.sec;}).slice(0,3);
 return{byType:byType,byPart:byPart,wrong:wrong,blank:blank,changedRight:changedRight,changedWrong:changedWrong,slow:slow,avg:flat.length?tel.totalSec/flat.length:0};
}
function drawReview(){
 var x=state.active,rv=state.review,a=rv.attempt,tel=rv.tel,ins=insightsOf(x,a,tel);
 rv.ins=ins;
 document.getElementById('reviewBanner').innerHTML='<div class="il-panel il-banner"><div><div class="il-big">'+(a.score===null?'—':esc(a.score)+'%')+'</div><div class="il-note">điểm luyện tập (không phải band IELTS chính thức)</div></div><div><strong>'+esc(a.correct)+'/'+esc(a.gradedCount)+'</strong><div class="il-note">câu đúng</div></div><div><strong>'+fmtClock(tel.totalSec)+'</strong><div class="il-note">thời gian làm bài</div></div><div><strong>'+ins.blank.length+'</strong><div class="il-note">câu bỏ trống</div></div><div><strong>'+tel.hidden+'</strong><div class="il-note">lần rời tab</div></div></div>';
 var typeRows=Object.keys(ins.byType).filter(function(t){return ins.byType[t].n;}).map(function(t){var b=ins.byType[t],pc=Math.round(b.ok*100/b.n);return '<div class="il-bar"><span>'+esc(typeName(t))+'</span><div><i style="width:'+pc+'%"></i></div><b>'+b.ok+'/'+b.n+'</b></div>';}).join('');
 var partRows=(x.sections||[]).map(function(s,p){var b=ins.byPart[p]||{ok:0,n:0};return '<tr><td>'+esc(secLabel(x,p))+'</td><td>'+b.ok+'/'+b.n+'</td><td>'+fmtClock(tel.partSec[p]||0)+'</td></tr>';}).join('');
 var weakest=Object.keys(ins.byType).filter(function(t){return ins.byType[t].n&&ins.byType[t].ok<ins.byType[t].n;}).sort(function(t1,t2){return ins.byType[t1].ok/ins.byType[t1].n-ins.byType[t2].ok/ins.byType[t2].n;})[0];
 var notes=[];
 if(weakest)notes.push('Dạng cần ưu tiên ôn: <b>'+esc(typeName(weakest))+'</b> ('+ins.byType[weakest].ok+'/'+ins.byType[weakest].n+' đúng).');
 if(ins.blank.length)notes.push('Câu bỏ trống: '+ins.blank.map(function(n){return 'Q'+n;}).join(', ')+'. Trong thi thật hãy điền một đáp án dự đoán thay vì để trống.');
 if(ins.changedRight+ins.changedWrong)notes.push('Bạn đổi đáp án ở '+(ins.changedRight+ins.changedWrong)+' câu: '+ins.changedRight+' câu đổi thành đúng, '+ins.changedWrong+' câu vẫn sai.');
 if(ins.slow.length)notes.push('Câu tốn nhiều thời gian nhưng vẫn sai: '+ins.slow.map(function(z){return 'Q'+z.n+' ('+z.sec+'s)';}).join(', ')+'. Nên đánh dấu rồi quay lại sau.');
 if(tel.hidden>0)notes.push('Bạn rời khỏi tab '+tel.hidden+' lần khi làm bài; hạn chế điều này để giữ nhịp như thi thật.');
 if(ins.avg)notes.push('Trung bình '+Math.round(ins.avg)+' giây/câu.');
 document.getElementById('insights').innerHTML='<div class="il-panel"><h3>Phân tích quá trình làm bài</h3><div class="il-insight-grid"><div>'+(typeRows||'<span class="il-note">Chưa có đáp án để chấm theo dạng câu hỏi.</span>')+'</div><div><table class="vm-table"><thead><tr><th>Phần</th><th>Đúng</th><th>Thời gian</th></tr></thead><tbody>'+partRows+'</tbody></table></div></div>'+(notes.length?'<ul class="il-notes">'+notes.map(function(n){return '<li>'+n+'</li>';}).join('')+'</ul>':'')+'</div>';
 document.getElementById('aiAgain').onclick=runAnalysis;
 document.getElementById('openAiSettings').onclick=aiSettings;
}

  qa('[data-del]').forEach(function(b){b.onclick=function(){s.questions.splice(+b.getAttribute('data-del'),1);drawTabs();drawPane();drawAnswers();};});

 function drawAnswers(){
  var n=0;
  document.getElementById('edAnswers').innerHTML=ed.sections.map(function(s,p){

 var sp=document.getElementById('edSplit');
 sp.addEventListener('input',function(e){var el=e.target,s=ed.sections[ed.part];
  if(el.hasAttribute('data-f')){s[el.getAttribute('data-f')]=el.value;return;}

 sp.addEventListener('change',function(e){var el=e.target,s=ed.sections[ed.part],box=el.closest('[data-qi]');if(!box)return;var q=s.questions[+box.getAttribute('data-qi')],f=el.getAttribute('data-qf');

 document.getElementById('edSkill').onchange=function(){var v=this.value;if(v===skill)return;var lim=v==='reading'?3:4;if(ed.sections.length>lim&&!confirm('Reading chỉ có tối đa 3 bài đọc. Các phần thừa sẽ bị bỏ.')){this.value=skill;return;}skill=v;ed.sections=ed.sections.slice(0,lim);ed.part=Math.min(ed.part,ed.sections.length-1);drawTabs();drawPane();drawAnswers();};

 function err(m){document.getElementById('edError').textContent=m;}
 function save(status){
  err('');var data=[],bad='';
  ed.sections.forEach(function(s,i){
   var qs=s.questions.filter(function(q){return q.prompt.trim()||q.answers.length;});
   if(!s.text.trim()&&!s.script.trim()&&!qs.length)return;
   if(!bad&&skill==='reading'&&!s.text.trim())bad=lab(i)+': chưa có nội dung bài đọc.';
   if(!bad&&skill==='listening'&&!s.text.trim()&&!s.script.trim())bad=lab(i)+': cần ghi chú hoặc script.';
   qs.forEach(function(q,k){if(bad)return;if(!q.prompt.trim())bad=lab(i)+', câu '+(k+1)+': thiếu nội dung câu hỏi.';else if(isChoice(q.type)&&q.options.length<2)bad=lab(i)+', câu '+(k+1)+' ('+typeName(q.type)+'): cần ít nhất 2 lựa chọn.';else if(status==='published'&&!q.answers.length)bad=lab(i)+', câu '+(k+1)+': chưa có đáp án (bắt buộc khi publish).';});
   var o={title:s.title||lab(i),text:s.text,questions:qs.map(function(q){return{type:q.type,prompt:q.prompt.trim(),options:isChoice(q.type)?q.options:[],answers:q.answers};})};
   if(skill==='listening')o.script=s.script;
   if(s.audio)o.audio=s.audio;
   data.push(o);});
  if(bad)return err(bad);
  if(!data.length||!data.some(function(s){return s.questions.length;}))return err('Cần ít nhất một câu hỏi.');
  var title=document.getElementById('edTitle').value.trim();if(!title)return err('Nhập tên đề.');
  if(edFile&&skill!=='listening')return err('Chỉ gắn audio cho đề Listening.');
  var cls=document.getElementById('edClasses').value;
  var payload={id:x.id||x._id,title:title,skill:skill,sourceUrl:document.getElementById('edUrl').value,sourceTitle:x.sourceTitle||'',sourceTestNumber:x.sourceTestNumber||'',attribution:document.getElementById('edAttr').value,allowedClassIds:cls?[cls]:[],visibility:priv&&status!=='review'?'private':'library',status:status,sections:data};
  call('ielts.content.save',payload).then(function(saved){if(!edFile)return saved;return call('ielts.audio.upload',{contentId:saved.id,file:edFile}).then(function(up){return call('ielts.audio.attach',{contentId:saved.id,audioPath:up.path,fileName:up.fileName,contentType:up.contentType,size:up.size});});}).then(function(){VM.toast(status==='published'?'Đã publish cho lớp.':(status==='review'?'Đã gửi vào hàng chờ kiểm tra.':'Đã lưu nháp.'),'success');load();}).catch(function(e){err(e.message);});
 }
 document.getElementById('saveDraft').onclick=function(){save(priv?'private':'draft');};
 var rvb=document.getElementById('review');if(rvb)rvb.onclick=function(){save('review');};
 var pub=document.getElementById('publish');if(pub)pub.onclick=function(){save('published');};
 drawTabs();drawPane();drawAnswers();
}

function aiSettings(){var saved=JSON.parse(localStorage.getItem('testsimu_ai_keys')||'{}');document.getElementById('extra').innerHTML='<div class="il-panel il-settings"><h3>AI settings · personal keys</h3><p class="il-note">Keys are saved only in this browser on this device. They are sent directly to the selected AI provider when you request feedback. They are never stored in Firebase.</p><label>Provider</label><select id="aiProvider" class="vm-select"><option value="gemini">Google Gemini</option><option value="groq">Groq</option></select><label>API key</label><input id="aiKey" class="vm-input" type="password" autocomplete="off" placeholder="Enter or replace API key"><p id="aiKeyState" class="il-note"></p><div class="il-row"><button id="aiSave" class="vm-btn vm-btn-primary">Save key on this device</button><button id="aiDelete" class="vm-btn vm-btn-ghost">Delete saved key</button></div></div>';document.getElementById('aiProvider').value=saved.provider||'gemini';document.getElementById('aiKeyState').textContent=saved.key?'A key is saved on this device. The full key is hidden.':'No key saved on this device.';document.getElementById('aiSave').onclick=function(){var provider=document.getElementById('aiProvider').value,key=document.getElementById('aiKey').value.trim();if(!key){document.getElementById('aiKeyState').textContent='Enter a key to save or replace it.';return;}localStorage.setItem('testsimu_ai_keys',JSON.stringify({provider:provider,key:key}));document.getElementById('aiKey').value='';document.getElementById('aiKeyState').textContent='Key saved on this device.';};document.getElementById('aiDelete').onclick=function(){localStorage.removeItem('testsimu_ai_keys');document.getElementById('aiKey').value='';document.getElementById('aiKeyState').textContent='Saved key deleted.';};}
/* ───────── AI feedback (student's own key; data goes straight to the provider) ───────── */
function aiKeys(){var k={};try{k=JSON.parse(localStorage.getItem('testsimu_ai_keys')||'{}');}catch(e){}if(k&&k.key)return k;var g=VM.geminiKey&&VM.geminiKey.get();if(g)return{provider:'gemini',key:g};var q=VM.groqKey&&VM.groqKey.get();if(q)return{provider:'groq',key:q};return null;}
function callAI(keys,prompt){
 if(keys.provider==='groq')return fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+keys.key},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:prompt}],temperature:0.3})}).then(function(r){if(!r.ok)throw new Error('AI provider error ('+r.status+'). Kiểm tra key trong AI settings.');return r.json();}).then(function(d){return d.choices[0].message.content;});
 var models=['gemini-2.5-flash','gemini-3.5-flash','gemini-3.5-flash-lite'],last=null;
 function next(i){if(i>=models.length)return Promise.reject(last||new Error('AI không phản hồi.'));
  return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+models[i]+':generateContent?key='+encodeURIComponent(keys.key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.3}})}).then(function(r){
   if(r.status===400||r.status===401||r.status===403)throw Object.assign(new Error('Key AI không hợp lệ ('+r.status+'). Kiểm tra trong AI settings.'),{fatal:true});
   if(!r.ok)throw new Error('AI provider error ('+r.status+').');return r.json();}).then(function(d){return d.candidates[0].content.parts.map(function(p){return p.text||'';}).join('');}).catch(function(e){if(e.fatal)throw e;last=e;return next(i+1);});}
 return next(0);
}
function runAnalysis(){
 var box=document.getElementById('aiFeedback'),rv=state.review,x=state.active;if(!box||!rv)return;
 var keys=aiKeys();
 if(!keys){box.innerHTML='Chưa có API key nên chỉ hiện phân tích cục bộ ở trên. Thêm key Gemini hoặc Groq trong AI settings để nhận nhận xét chi tiết từng câu sai.';return;}
 var a=rv.attempt,tel=rv.tel,ins=rv.ins||insightsOf(x,a,tel),flat=flatQs(x),resp=a.responses||[],snapSecs=(a.snapshot&&a.snapshot.sections)||[];
 var focus={};ins.wrong.forEach(function(n){focus[n]=1;});ins.slow.forEach(function(z){focus[z.n]=1;});
 var qs=flat.filter(function(f){return focus[f.n];}).slice(0,25).map(function(f){var rr=resp[f.n-1]||{},t=tel.per[f.n-1]||{};return{n:f.n,part:f.part+1,type:f.q.type,prompt:f.q.prompt,options:f.q.options||[],studentAnswer:rr.answer||'(bỏ trống)',correctAnswers:rr.accepted||[],correct:rr.correct,seconds:t.sec,answerChanges:t.changes};});
 var parts={};qs.forEach(function(q){if(!parts[q.part]){var s=snapSecs[q.part-1]||(x.sections||[])[q.part-1]||{};parts[q.part]={passage:String(s.text||'').slice(0,3500),script:String(s.script||'').slice(0,3500)};}});
 var data={skill:x.skill,score:{correct:a.correct,graded:a.gradedCount,percent:a.score},totalSeconds:tel.totalSec,secondsPerPart:tel.partSec,leftTabCount:tel.hidden,blankQuestions:ins.blank,answerChanged:{becameCorrect:ins.changedRight,stillWrong:ins.changedWrong},accuracyByType:ins.byType,questionsToReview:qs,contextByPart:parts};
 var prompt='Bạn là giáo viên IELTS Reading/Listening cho sinh viên Việt Nam. Dựa vào dữ liệu JSON về bài làm (kết quả, thời gian từng câu, số lần đổi đáp án, câu bỏ trống, số lần rời tab), hãy viết nhận xét bằng TIẾNG VIỆT, văn bản thuần (không markdown), gồm: 1) Nhận xét tổng quan; 2) Điểm mạnh; 3) Thói quen làm bài đáng chú ý (dựa trên thời gian, đổi đáp án, bỏ trống); 4) Với từng câu trong questionsToReview: giải thích ngắn vì sao đáp án đúng là correctAnswers, dựa trên contextByPart, và lỗi có thể đã mắc; 5) Kế hoạch luyện tập 3 bước cho tuần tới. Chỉ dùng thông tin trong dữ liệu, không bịa. Nếu thiếu ngữ cảnh thì nói rõ. Ghi chú cuối: đây là gợi ý học tập do AI tạo, không phải chấm điểm của giáo viên.\nDỮ LIỆU: '+JSON.stringify(data);
 box.textContent='Đang tạo nhận xét…';
 callAI(keys,prompt).then(function(t){box.textContent=t;}).catch(function(e){box.textContent=e.message;});
}

function importUrl(){var url=prompt('Enter a specific IELTS Training Online lesson URL (HTTPS only).');if(!url)return;call('ielts.importUrl',{url:url}).then(function(d){editorDialog(false,{title:d.title||'',sourceUrl:url,sourceTitle:d.sourceTitle||'',skill:d.skill||'reading',sections:d.sections||[]});if(d.warning)say(d.warning);}).catch(function(e){say(e.message);});}
function teacherReports(){call('ielts.report.list').then(function(rows){document.getElementById('extra').innerHTML='<div class="il-panel" style="margin-top:16px"><h3>Student reports</h3><div style="overflow:auto"><table class="vm-table"><thead><tr><th>Student</th><th>Lesson</th><th>Question</th><th>Report</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(rows.length?rows.map(function(r){return '<tr><td>'+esc(r.studentName)+'</td><td>'+esc(r.contentTitle)+'</td><td>'+esc(r.questionNumber||'—')+'</td><td>'+esc(r.message)+'</td><td>'+esc(r.status)+'</td><td><button class="vm-btn vm-btn-sm" data-resolve="'+esc(r.id||r._id)+'">Mark resolved</button></td></tr>';}).join(''):'<tr><td colspan="6">No reports.</td></tr>')+'</tbody></table></div></div>';Array.from(document.querySelectorAll('[data-resolve]')).forEach(function(b){b.onclick=function(){call('ielts.report.update',{id:b.dataset.resolve,status:'resolved'}).then(teacherReports).catch(function(e){say(e.message);});};});}).catch(function(e){say(e.message);});}function drawChart(el,rows){rows=rows.filter(function(r){return typeof r.score==='number'&&isFinite(r.score);});if(!rows.length)return;var w=700,h=210,p=28;var pts=rows.map(function(r,i){return [p+(rows.length<2?0:i*(w-2*p)/(rows.length-1)),h-p-r.score*(h-2*p)/100];});var line=pts.map(function(a){return a.join(',');}).join(' ');el.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" class="il-chart" role="img" aria-label="Practice score over time"><line x1="'+p+'" y1="'+(h-p)+'" x2="'+(w-p)+'" y2="'+(h-p)+'" stroke="#9ca3af"/><line x1="'+p+'" y1="'+p+'" x2="'+p+'" y2="'+(h-p)+'" stroke="#9ca3af"/><text x="4" y="'+(p+4)+'" font-size="12">100</text><text x="12" y="'+(h-p)+'" font-size="12">0</text><polyline fill="none" stroke="#2A7BA3" stroke-width="3" points="'+line+'"/>'+pts.map(function(a,i){return '<circle cx="'+a[0]+'" cy="'+a[1]+'" r="4" fill="#2A7BA3"><title>'+rows[i].score+'% · '+esc(rows[i].title)+'</title></circle>';}).join('')+'</svg>';}
function studentResults(){var rows=state.attempts.slice(-50);document.getElementById('extra').innerHTML='<div class="il-panel" style="margin-top:16px"><h3>My practice results</h3><div class="il-toolbar"><select id="rsSkill" class="vm-select"><option value="all">Reading & Listening</option><option value="reading">Reading</option><option value="listening">Listening</option></select><label>From <input id="rsDate" type="date" class="vm-input"></label></div><div id="chart"></div><p id="empty" class="il-empty" style="display:none">Complete an attempt to see progress here.</p><div style="overflow:auto"><table class="vm-table"><thead><tr><th>Lesson</th><th>Skill</th><th>Score (practice)</th><th>Questions correct</th><th>Time</th><th>Date</th></tr></thead><tbody id="history"></tbody></table></div></div>';function refresh(){var skill=document.getElementById('rsSkill').value,since=document.getElementById('rsDate').value;var r=rows.filter(function(a){return(skill==='all'||a.skill===skill)&&(!since||a.completedAt.slice(0,10)>=since);});var e=document.getElementById('empty');e.style.display=r.length?'none':'block';document.getElementById('chart').innerHTML='';if(r.length)drawChart(document.getElementById('chart'),r);document.getElementById('history').innerHTML=r.slice().reverse().map(function(a){return '<tr><td>'+esc(a.title)+'</td><td>'+esc(a.skill)+'</td><td>'+(a.score===null?'Not scored · answer key pending':a.score+'%')+'</td><td>'+a.correct+'/'+a.gradedCount+' scored ('+a.total+' total)'+'</td><td>'+Math.round(a.durationSeconds/60)+' min</td><td>'+new Date(a.completedAt).toLocaleDateString()+'</td></tr>';}).join('');}document.getElementById('rsSkill').onchange=refresh;document.getElementById('rsDate').onchange=refresh;refresh();}
function teacherResults(){document.getElementById('extra').innerHTML='<div class="il-panel" style="margin-top:16px"><h3>Class results</h3><div class="il-toolbar"><select class="vm-select" id="trClass"><option value="">Select a class</option>'+state.classes.map(function(c){return '<option value="'+esc(c.classId)+'">'+esc(c.className)+'</option>';}).join('')+'</select><select class="vm-select" id="trSkill"><option value="all">All skills</option><option value="reading">Reading</option><option value="listening">Listening</option></select><select class="vm-select" id="trStudent"><option value="all">All students</option></select><select class="vm-select" id="trItem"><option value="all">All lessons</option></select><input class="vm-input" type="date" id="trSince" aria-label="Start date"></div><div id="trChart"></div><div style="overflow:auto"><table class="vm-table"><thead><tr><th>Student</th><th>Lesson</th><th>Skill</th><th>Practice score</th><th>Time</th><th>Completed</th></tr></thead><tbody id="trRows"></tbody></table></div></div>';var rows=[];function refresh(){var cls=document.getElementById('trClass').value;if(!cls){document.getElementById('trRows').innerHTML='<tr><td colspan="6">Choose a class to view results.</td></tr>';document.getElementById('trChart').innerHTML='';return;}call('ielts.attempt.list',{classId:cls}).then(function(data){rows=data||[];var students=Array.from(new Set(rows.map(function(a){return a.studentId;})));var items=Array.from(new Set(rows.map(function(a){return a.contentId;})));document.getElementById('trStudent').innerHTML='<option value="all">All students</option>'+students.map(function(id){var a=rows.find(function(r){return r.studentId===id;});return '<option value="'+esc(id)+'">'+esc(a.studentName||id)+'</option>';}).join('');document.getElementById('trItem').innerHTML='<option value="all">All lessons</option>'+items.map(function(id){var a=rows.find(function(r){return r.contentId===id;});return '<option value="'+esc(id)+'">'+esc(a.title)+'</option>';}).join('');filter();}).catch(function(e){say(e.message);});}function filter(){var skill=document.getElementById('trSkill').value,student=document.getElementById('trStudent').value,item=document.getElementById('trItem').value,since=document.getElementById('trSince').value;var r=rows.filter(function(a){return(skill==='all'||a.skill===skill)&&(student==='all'||a.studentId===student)&&(item==='all'||a.contentId===item)&&(!since||a.completedAt.slice(0,10)>=since);});document.getElementById('trChart').innerHTML='';if(r.length)drawChart(document.getElementById('trChart'),r);document.getElementById('trRows').innerHTML=r.slice().reverse().map(function(a){return '<tr><td>'+esc(a.studentName)+'</td><td>'+esc(a.title)+'</td><td>'+esc(a.skill)+'</td><td>'+(a.score===null?'Not scored · answer key pending':a.score+'%')+' · '+a.correct+'/'+a.gradedCount+' scored</td><td>'+Math.round(a.durationSeconds/60)+' min</td><td>'+new Date(a.completedAt).toLocaleString()+'</td></tr>';}).join('')||'<tr><td colspan="6">No attempts for these filters.</td></tr>';}document.getElementById('trClass').onchange=refresh;['trSkill','trStudent','trItem','trSince'].forEach(function(id){document.getElementById(id).onchange=filter;});}
load();

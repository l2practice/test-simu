(function(){
'use strict';

function load(){root().innerHTML='<div class="il-empty">Đang tải…</div>';var second=teacher?call('class.list'):call('ielts.attempt.list');Promise.all([call('ielts.content.list'),second]).then(function(v){state.items=v[0]||[];if(teacher)state.classes=v[1]||[];else state.attempts=v[1]||[];draw();}).catch(function(e){root().innerHTML='<div class="il-empty">'+esc(e.message)+'</div>';});}

function drawStudent(){var items=state.items.filter(function(x){return x.status==='published'||x.visibility==='private';});root().innerHTML='<div class="ielts-wrap"><div class="ielts-hero"><h2>Reading & Listening practice</h2><p>Practice published Reading and Listening tests, or create a draft to contribute to your class library.</p></div><div class="il-toolbar"><select class="vm-select" id="skill"><option value="all">All skills</option><option value="reading">Reading</option><option value="listening">Listening</option></select><select class="vm-select" id="task"><option value="all">All task types</option>'+taskOptions()+'</select><button class="vm-btn vm-btn-primary" id="full">Full Test · 3 sections</button><button class="vm-btn vm-btn-ghost" id="free">＋ Free practice</button><button class="vm-btn vm-btn-ghost" id="results">My results</button><button class="vm-btn vm-btn-ghost" id="aiSettings">AI settings</button></div><div class="il-grid" id="cards"></div><div id="extra"></div></div>';document.getElementById('skill').value=state.filter;function cards(){var skill=document.getElementById('skill').value,task=document.getElementById('task').value;var rows=items.filter(function(x){return(skill==='all'||x.skill===skill)&&(task==='all'||(x.taskTypes||[]).indexOf(task)>=0);});document.getElementById('cards').innerHTML=rows.length?rows.map(function(x){return '<article class="il-card"><span class="il-badge">'+esc(x.skill)+'</span><h3>'+esc(titleItem(x))+'</h3><div class="il-meta">'+(x.sections||[]).length+' section(s) · '+(x.sections||[]).reduce(function(n,s){return n+(s.questions||[]).length;},0)+' questions'+(x.status==='published'?' · Published':(x.status==='review'?' · Chờ kiểm tra':' · Private'))+'</div><div class="il-meta">'+esc((x.taskTypes||[]).join(' · '))+'</div><button class="vm-btn vm-btn-primary" data-open="'+esc(x.id||x._id)+'">Start practice</button></article>';}).join(''):'<div class="il-empty">No lessons match these filters yet.</div>';Array.from(document.querySelectorAll('[data-open]')).forEach(function(b){b.onclick=function(){call('ielts.content.get',{id:b.dataset.open}).then(function(x){state.active=x;state.started=new Date().toISOString();state.answers=[];draw();}).catch(function(e){say(e.message);});};});}document.getElementById('skill').onchange=cards;document.getElementById('task').onchange=cards;cards();document.getElementById('full').onclick=function(){var skill=document.getElementById('skill').value;if(skill==='all')skill='reading';var candidates=items.filter(function(x){return (x.status==='published'||x.status==='review')&&x.skill===skill;});if(candidates.length<3){say('Cần ít nhất ba bài đã publish cùng skill để tạo Full Test.');return;}var chosen=candidates.slice(0,3),combined={id:chosen.map(function(x){return x.id||x._id;}).join(','),title:'Full Test · '+skill,skill:skill,visibility:'library',version:1,taskTypes:Array.from(new Set([].concat.apply([],chosen.map(function(x){return x.taskTypes||[];})))),sections:chosen.reduce(function(a,x){return a.concat(x.sections||[]);},[])};state.active=combined;state.started=new Date().toISOString();draw();};document.getElementById('free').onclick=function(){editorDialog(true);};document.getElementById('results').onclick=studentResults;document.getElementById('aiSettings').onclick=aiSettings;}

 var x=state.active,sections=x.sections||[],qs=sections.flatMap(function(s){return s.questions||[];});

 Array.from(document.querySelectorAll('[data-audio-path]')).forEach(function(a){call('ielts.audio.url',{path:a.getAttribute('data-audio-path')}).then(function(url){a.src=url;}).catch(function(e){say(e.message);});});
 document.getElementById('exit').onclick=function(){state.active=null;draw();};
 document.getElementById('report').onclick=function(){var n=prompt('Question number (optional):'),message=prompt('Describe the issue for your teacher:');if(!message)return;call('ielts.report.create',{contentId:String(x.id||x._id).split(',')[0],contentTitle:titleItem(x),questionNumber:n,message:message,privateContent:x.visibility==='private'}).then(function(){VM.toast('Report sent to your teacher.','success');}).catch(function(e){say(e.message);});};
 document.getElementById('submit').onclick=function(){

    extra.innerHTML='<div class="il-panel"><h3>Attempt submitted · '+esc(r.correct)+'/'+esc(r.gradedCount)+' correct</h3><p>Practice score: '+(r.score===null?'Not scored':esc(r.score)+'%')+'. AI feedback is study guidance, not teacher-verified marking.</p>'+scripts+'<div class="il-toolbar"><button class="vm-btn vm-btn-primary" id="analyzeAttempt">Get AI feedback</button><button class="vm-btn vm-btn-ghost" id="openAiSettings">AI settings</button></div><div id="aiFeedback" class="il-ai-output"></div></div>';

   }

  }).catch(function(e){btn.disabled=false;say(e.message);});
 };

function drawTeacher(){root().innerHTML='<div class="ielts-wrap"><div class="ielts-hero"><h2>IELTS Library</h2><p>Create content, check drafts and publish approved items to selected classes.</p></div><div class="il-toolbar"><button class="vm-btn vm-btn-primary" id="new">＋ New content</button><button class="vm-btn vm-btn-ghost" id="url">Import from URL</button><button class="vm-btn vm-btn-ghost" id="tresults">Class results</button><button class="vm-btn vm-btn-ghost" id="reports">Student reports</button></div><div class="il-grid">'+(state.items.length?state.items.map(function(x){return '<article class="il-card"><span class="il-badge">'+esc(x.skill)+' · '+esc(x.status==='review'?'Chờ kiểm tra':x.status)+'</span><h3>'+esc(titleItem(x))+'</h3><div class="il-meta">'+esc((x.taskTypes||[]).join(' · '))+' · v'+esc(x.version||1)+'</div><button class="vm-btn vm-btn-primary" data-edit="'+esc(x.id||x._id)+'">Edit / review</button> '+(x.status!=='archived'?'<button class="vm-btn vm-btn-ghost" data-archive="'+esc(x.id||x._id)+'">Archive</button>':'')+'</article>';}).join(''):'<div class="il-empty">No Library content yet.</div>')+'</div><div id="extra"></div></div>';document.getElementById('new').onclick=function(){editorDialog(false);};document.getElementById('url').onclick=importUrl;document.getElementById('tresults').onclick=teacherResults;document.getElementById('reports').onclick=teacherReports;Array.from(document.querySelectorAll('[data-edit]')).forEach(function(b){b.onclick=function(){call('ielts.content.get',{id:b.dataset.edit}).then(function(x){editorDialog(false,x);}).catch(function(e){say(e.message);});};});Array.from(document.querySelectorAll('[data-archive]')).forEach(function(b){b.onclick=function(){if(confirm('Archive this content? Existing attempts remain saved.'))call('ielts.content.archive',{id:b.dataset.archive}).then(load).catch(function(e){say(e.message);});};});}

function editorDialog(priv,initial){var x=initial||{skill:'reading',title:'',sections:[{title:'Passage 1',text:'',questions:[]}]};var skill=x.skill||'reading',sections=(x.sections&&x.sections.length?x.sections:[{title:skill==='reading'?'Passage 1':'Part 1',text:'',questions:[]}]).map(function(s){return JSON.parse(JSON.stringify(s));});var html='<div class="il-panel" style="margin-top:18px"><h3>'+(priv?'Create practice set':'Create / review content')+'</h3><p class="il-note">Fill in each section separately. Questions and answer keys are kept in matching order.</p><div class="il-editor"><div><label class="vm-label">Test title</label><input class="vm-input" id="edTitle" value="'+esc(x.title)+'"><label class="vm-label">Skill</label><select class="vm-select" id="edSkill"><option value="reading">Reading</option><option value="listening">Listening</option></select><label class="vm-label">Source URL</label><input class="vm-input" id="edUrl" value="'+esc(x.sourceUrl||'')+'"><label class="vm-label">Attribution / licence note</label><input class="vm-input" id="edAttr" value="'+esc(x.attribution||'')+'"><label class="vm-label">Class with access</label><select class="vm-select" id="edClasses"><option value="">Choose later (draft only)</option>'+state.classes.map(function(c){var selected=(x.allowedClassIds||[]).includes(c.classId);return '<option value="'+esc(c.classId)+'" '+(selected?'selected':'')+'>'+esc(c.className)+'</option>';}).join('')+'</select><label class="vm-label">Sections</label><div class="il-toolbar"><button type="button" class="vm-btn vm-btn-ghost" id="addSection">＋ Add section</button><span class="il-note" id="sectionCount"></span></div></div><div><label class="vm-label">Listening audio (optional, max 25 MB)</label><input class="vm-input" type="file" id="edAudio" accept="audio/mpeg,audio/mp4,audio/wav,audio/x-wav,audio/webm,audio/ogg,audio/aac,audio/flac"><div class="il-note">MP3, MP4, WAV, WebM, OGG, AAC or FLAC. Upload audio you have permission to use. Do not use audio downloaded from source websites.</div><div class="il-note">For options, write them after the second “|”, separated by semicolons. Example: “Question prompt | multiple-choice | option A; option B; option C”. For short answer: “Question prompt | short-answer”.</div></div></div><div id="edSections"></div><section class="il-answer-key"><h3>Answer key</h3><p class="il-note">Enter answers in the same order as the questions above. Separate accepted alternatives with “|”, one question per line.</p><div id="edAnswers"></div></section><div id="edError" class="il-error"></div><div class="il-row" style="margin-top:12px"><button class="vm-btn vm-btn-primary" id="saveDraft">Save draft</button>'+(priv?'<button class="vm-btn vm-btn-ghost" id="review">Finish & contribute</button>':'<button class="vm-btn vm-btn-ghost" id="review">Send for review</button><button class="vm-btn" id="publish" style="background:var(--vm-primary);color:white">Publish to selected class</button>')+'<button class="vm-btn vm-btn-ghost" id="cancel">Cancel</button></div></div>';document.getElementById('extra').innerHTML=html;document.getElementById('edSkill').value=skill;var edFile=null;document.getElementById('edAudio').onchange=function(){edFile=this.files&&this.files[0]||null;};document.getElementById('cancel').onclick=function(){document.getElementById('extra').innerHTML='';};function preset(sec,index){var questions=(sec.questions||[]).map(function(q){return [q.prompt||'',q.type||q.taskType||'short-answer',(q.options||[]).join('; ')].join(' | ');}).join('\n');var answers=(sec.questions||[]).map(function(q){return (q.answers||[]).join(' | ');}).join('\n');return {title:sec.title||((skill==='reading'?'Passage ':'Part ')+(index+1)),text:sec.text||'',script:sec.script||'',questions:questions,answers:answers,audio:sec.audio||null};}function renderSections(){var skillNow=document.getElementById('edSkill').value,limit=skillNow==='reading'?3:4;sections=sections.slice(0,limit);if(!sections.length)sections.push({title:(skillNow==='reading'?'Passage ':'Part ')+'1',text:'',questions:[]});document.getElementById('sectionCount').textContent=sections.length+' / '+limit;document.getElementById('addSection').disabled=sections.length>=limit;document.getElementById('edSections').innerHTML=sections.map(function(sec,i){var d=preset(sec,i);return '<div class="il-section-editor"><h4>'+esc(d.title)+'</h4><div class="il-section-grid '+(skillNow==='listening'?'three':'')+'"><div><label class="vm-label">'+(skillNow==='reading'?'Bài đọc '+(i+1):'Audio context / notes · Part '+(i+1))+'</label><textarea class="vm-input" data-passage="'+i+'" placeholder="Paste the '+(skillNow==='reading'?'passage text':'section notes')+' here">'+esc(d.text)+'</textarea></div><div><label class="vm-label">Câu hỏi '+(i+1)+'</label><textarea class="vm-input" data-questions="'+i+'" placeholder="Question prompt | task-type | option A; option B\nOne question per line">'+esc(d.questions)+'</textarea></div>'+(skillNow==='listening'?'<div><label class="vm-label">Script · Part '+(i+1)+' (optional)</label><textarea class="vm-input" data-script="'+i+'" placeholder="Enter listening script, if available">'+esc(d.script)+'</textarea></div>':'')+'</div></div>';}).join('');document.getElementById('edAnswers').innerHTML=sections.map(function(sec,i){var d=preset(sec,i);return '<div style="margin:12px 0"><label class="vm-label">'+esc(d.title)+' · answer keys in question order</label><textarea class="vm-input" data-answers="'+i+'" placeholder="answer | accepted alternative; one per question">'+esc(d.answers)+'</textarea></div>';}).join('');document.getElementById('addSection').onclick=function(){if(sections.length>=limit)return;sections.push({title:(skillNow==='reading'?'Passage ':'Part ')+(sections.length+1),text:'',script:'',questions:[]});renderSections();};}document.getElementById('edSkill').onchange=function(){skill=this.value;if(!sections.length)sections=[{title:(skill==='reading'?'Passage ':'Part ')+'1',text:'',questions:[]}];renderSections();};function parseSection(i){var title=((document.querySelectorAll('[data-passage]')[i].closest('.il-section-editor').querySelector('h4')||{}).textContent)||((skill==='reading'?'Passage ':'Part ')+(i+1));var lines=document.querySelector('[data-questions="'+i+'"]').value.split(/\r?\n/).map(function(v){return v.trim();}).filter(Boolean),keys=document.querySelector('[data-answers="'+i+'"]').value.split(/\r?\n/);var questions=lines.map(function(line,qi){var parts=line.split('|').map(function(v){return v.trim();});var type=(parts[1]||'short-answer').toLowerCase().replace(/\s+/g,'-');return {prompt:parts[0],type:type,options:(parts[2]||'').split(';').map(function(v){return v.trim();}).filter(Boolean),answers:(keys[qi]||'').split('|').map(function(v){return v.trim();}).filter(Boolean)};});return {title:title,text:document.querySelector('[data-passage="'+i+'"]').value,script:document.querySelector('[data-script="'+i+'"]').value,questions:questions};}renderSections();function save(status){var dataSections=sections.map(function(_,i){return parseSection(i);});if(!dataSections.some(function(s){return s.text.trim()||s.questions.length;})){document.getElementById('edError').textContent='Add passage or section content and at least one question.';return;}if(dataSections.some(function(s){return s.questions.some(function(q){return !q.prompt||!q.type;});})){document.getElementById('edError').textContent='Check each question line: prompt | task-type | options (optional).';return;}if(status==='published'&&dataSections.some(function(s){return s.questions.some(function(q){return !q.answers.length;});})){document.getElementById('edError').textContent='Add an answer key for every question before publishing.';return;}var cls=document.getElementById('edClasses').value;var data={id:x.id||x._id,title:document.getElementById('edTitle').value.trim(),skill:document.getElementById('edSkill').value,sourceUrl:document.getElementById('edUrl').value,sourceTitle:x.sourceTitle||'',sourceTestNumber:x.sourceTestNumber||'',attribution:document.getElementById('edAttr').value,allowedClassIds:cls?[cls]:[],visibility:priv&&status!=='review'?'private':'library',status:status,sections:dataSections};if(!data.title){document.getElementById('edError').textContent='Enter a title for this test.';return;}if(edFile&&data.skill!=='listening'){document.getElementById('edError').textContent='Audio can only be attached to Listening content.';return;}call('ielts.content.save',data).then(function(saved){if(!edFile)return saved;return call('ielts.audio.upload',{contentId:saved.id,file:edFile}).then(function(up){return call('ielts.audio.attach',{contentId:saved.id,audioPath:up.path,fileName:up.fileName,contentType:up.contentType,size:up.size});});}).then(function(){VM.toast(status==='published'?'Published to selected class.':(status==='review'?'Sent to your teacher for review.':'Draft saved.'),'success');load();}).catch(function(e){document.getElementById('edError').textContent=e.message;});}document.getElementById('saveDraft').onclick=function(){save(priv?'private':'draft');};var review=document.getElementById('review');if(review)review.onclick=function(){save('review');};var pub=document.getElementById('publish');if(pub)pub.onclick=function(){save('published');};}
function aiSettings(){var saved=JSON.parse(localStorage.getItem('testsimu_ai_keys')||'{}');document.getElementById('extra').innerHTML='<div class="il-panel il-settings"><h3>AI settings · personal keys</h3><p class="il-note">Keys are saved only in this browser on this device. They are sent directly to the selected AI provider when you request feedback. They are never stored in Firebase.</p><label>Provider</label><select id="aiProvider" class="vm-select"><option value="gemini">Google Gemini</option><option value="groq">Groq</option></select><label>API key</label><input id="aiKey" class="vm-input" type="password" autocomplete="off" placeholder="Enter or replace API key"><p id="aiKeyState" class="il-note"></p><div class="il-row"><button id="aiSave" class="vm-btn vm-btn-primary">Save key on this device</button><button id="aiDelete" class="vm-btn vm-btn-ghost">Delete saved key</button></div></div>';document.getElementById('aiProvider').value=saved.provider||'gemini';document.getElementById('aiKeyState').textContent=saved.key?'A key is saved on this device. The full key is hidden.':'No key saved on this device.';document.getElementById('aiSave').onclick=function(){var provider=document.getElementById('aiProvider').value,key=document.getElementById('aiKey').value.trim();if(!key){document.getElementById('aiKeyState').textContent='Enter a key to save or replace it.';return;}localStorage.setItem('testsimu_ai_keys',JSON.stringify({provider:provider,key:key}));document.getElementById('aiKey').value='';document.getElementById('aiKeyState').textContent='Key saved on this device.';};document.getElementById('aiDelete').onclick=function(){localStorage.removeItem('testsimu_ai_keys');document.getElementById('aiKey').value='';document.getElementById('aiKeyState').textContent='Saved key deleted.';};}
function analyzeAttempt(attempt){var box=document.getElementById('aiFeedback');if(!box)return;var keys=JSON.parse(localStorage.getItem('testsimu_ai_keys')||'{}');if(!keys.key){box.innerHTML='Add your Gemini or Groq key in AI settings to get feedback. <button class="vm-btn vm-btn-ghost" id="feedbackSettings">Open AI settings</button>';document.getElementById('feedbackSettings').onclick=aiSettings;return;}var questions=(attempt.snapshot&&attempt.snapshot.sections||[]).flatMap(function(s){return (s.questions||[]).map(function(q){return {passage:s.text,script:s.script||'',question:q};});});var wrong=(attempt.responses||[]).filter(function(r){return r.correct===false;}).map(function(r){var item=questions[r.questionIndex]||{};return {question:item.question&&item.question.prompt,taskType:item.question&&(item.question.type||item.question.taskType),context:(item.passage||item.script||'').slice(0,1200),yourAnswer:r.answer};});var prompt='You are an IELTS Reading and Listening tutor. Analyze the completed practice attempt. Score: '+attempt.correct+'/'+attempt.gradedCount+' graded correct ('+attempt.score+'%). Give a concise overall observation, identify patterns, and give study advice. For each incorrect answer, explain what to reconsider based on the provided question/context and student answer. Do not claim access to an answer key; do not invent the official correct answer. If context is insufficient, say so. Clearly say this is AI-generated study guidance, not a teacher-verified marking. Data: '+JSON.stringify(wrong.slice(0,30));box.textContent='Generating AI feedback…';var req;if(keys.provider==='groq'){req=fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+keys.key},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:prompt}],temperature:0.3})}).then(function(r){if(!r.ok)throw new Error('AI provider error ('+r.status+'). Check the key in AI settings.');return r.json();}).then(function(d){return d.choices[0].message.content;});}else{req=fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(keys.key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.3}})}).then(function(r){if(!r.ok)throw new Error('AI provider error ('+r.status+'). Check the key in AI settings.');return r.json();}).then(function(d){return d.candidates[0].content.parts.map(function(p){return p.text||'';}).join('');});}req.then(function(txt){box.textContent=txt;}).catch(function(e){box.textContent=e.message;});}
function importUrl(){var url=prompt('Enter a specific IELTS Training Online lesson URL (HTTPS only).');if(!url)return;call('ielts.importUrl',{url:url}).then(function(d){editorDialog(false,{title:d.title||'',sourceUrl:url,sourceTitle:d.sourceTitle||'',skill:d.skill||'reading',sections:d.sections||[]});if(d.warning)say(d.warning);}).catch(function(e){say(e.message);});}
function teacherReports(){call('ielts.report.list').then(function(rows){document.getElementById('extra').innerHTML='<div class="il-panel" style="margin-top:16px"><h3>Student reports</h3><div style="overflow:auto"><table class="vm-table"><thead><tr><th>Student</th><th>Lesson</th><th>Question</th><th>Report</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(rows.length?rows.map(function(r){return '<tr><td>'+esc(r.studentName)+'</td><td>'+esc(r.contentTitle)+'</td><td>'+esc(r.questionNumber||'—')+'</td><td>'+esc(r.message)+'</td><td>'+esc(r.status)+'</td><td><button class="vm-btn vm-btn-sm" data-resolve="'+esc(r.id||r._id)+'">Mark resolved</button></td></tr>';}).join(''):'<tr><td colspan="6">No reports.</td></tr>')+'</tbody></table></div></div>';Array.from(document.querySelectorAll('[data-resolve]')).forEach(function(b){b.onclick=function(){call('ielts.report.update',{id:b.dataset.resolve,status:'resolved'}).then(teacherReports).catch(function(e){say(e.message);});};});}).catch(function(e){say(e.message);});}function drawChart(el,rows){rows=rows.filter(function(r){return typeof r.score==='number'&&isFinite(r.score);});if(!rows.length)return;var w=700,h=210,p=28;var pts=rows.map(function(r,i){return [p+(rows.length<2?0:i*(w-2*p)/(rows.length-1)),h-p-r.score*(h-2*p)/100];});var line=pts.map(function(a){return a.join(',');}).join(' ');el.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" class="il-chart" role="img" aria-label="Practice score over time"><line x1="'+p+'" y1="'+(h-p)+'" x2="'+(w-p)+'" y2="'+(h-p)+'" stroke="#9ca3af"/><line x1="'+p+'" y1="'+p+'" x2="'+p+'" y2="'+(h-p)+'" stroke="#9ca3af"/><text x="4" y="'+(p+4)+'" font-size="12">100</text><text x="12" y="'+(h-p)+'" font-size="12">0</text><polyline fill="none" stroke="#FF6B52" stroke-width="3" points="'+line+'"/>'+pts.map(function(a,i){return '<circle cx="'+a[0]+'" cy="'+a[1]+'" r="4" fill="#FF6B52"><title>'+rows[i].score+'% · '+esc(rows[i].title)+'</title></circle>';}).join('')+'</svg>';}
function studentResults(){var rows=state.attempts.slice(-50);document.getElementById('extra').innerHTML='<div class="il-panel" style="margin-top:16px"><h3>My practice results</h3><div class="il-toolbar"><select id="rsSkill" class="vm-select"><option value="all">Reading & Listening</option><option value="reading">Reading</option><option value="listening">Listening</option></select><label>From <input id="rsDate" type="date" class="vm-input"></label></div><div id="chart"></div><p id="empty" class="il-empty" style="display:none">Complete an attempt to see progress here.</p><div style="overflow:auto"><table class="vm-table"><thead><tr><th>Lesson</th><th>Skill</th><th>Score (practice)</th><th>Questions correct</th><th>Time</th><th>Date</th></tr></thead><tbody id="history"></tbody></table></div></div>';function refresh(){var skill=document.getElementById('rsSkill').value,since=document.getElementById('rsDate').value;var r=rows.filter(function(a){return(skill==='all'||a.skill===skill)&&(!since||a.completedAt.slice(0,10)>=since);});var e=document.getElementById('empty');e.style.display=r.length?'none':'block';document.getElementById('chart').innerHTML='';if(r.length)drawChart(document.getElementById('chart'),r);document.getElementById('history').innerHTML=r.slice().reverse().map(function(a){return '<tr><td>'+esc(a.title)+'</td><td>'+esc(a.skill)+'</td><td>'+(a.score===null?'Not scored · answer key pending':a.score+'%')+'</td><td>'+a.correct+'/'+a.gradedCount+' scored ('+a.total+' total)'+'</td><td>'+Math.round(a.durationSeconds/60)+' min</td><td>'+new Date(a.completedAt).toLocaleDateString()+'</td></tr>';}).join('');}document.getElementById('rsSkill').onchange=refresh;document.getElementById('rsDate').onchange=refresh;refresh();}
function teacherResults(){document.getElementById('extra').innerHTML='<div class="il-panel" style="margin-top:16px"><h3>Class results</h3><div class="il-toolbar"><select class="vm-select" id="trClass"><option value="">Select a class</option>'+state.classes.map(function(c){return '<option value="'+esc(c.classId)+'">'+esc(c.className)+'</option>';}).join('')+'</select><select class="vm-select" id="trSkill"><option value="all">All skills</option><option value="reading">Reading</option><option value="listening">Listening</option></select><select class="vm-select" id="trStudent"><option value="all">All students</option></select><select class="vm-select" id="trItem"><option value="all">All lessons</option></select><input class="vm-input" type="date" id="trSince" aria-label="Start date"></div><div id="trChart"></div><div style="overflow:auto"><table class="vm-table"><thead><tr><th>Student</th><th>Lesson</th><th>Skill</th><th>Practice score</th><th>Time</th><th>Completed</th></tr></thead><tbody id="trRows"></tbody></table></div></div>';var rows=[];function refresh(){var cls=document.getElementById('trClass').value;if(!cls){document.getElementById('trRows').innerHTML='<tr><td colspan="6">Choose a class to view results.</td></tr>';document.getElementById('trChart').innerHTML='';return;}call('ielts.attempt.list',{classId:cls}).then(function(data){rows=data||[];var students=Array.from(new Set(rows.map(function(a){return a.studentId;})));var items=Array.from(new Set(rows.map(function(a){return a.contentId;})));document.getElementById('trStudent').innerHTML='<option value="all">All students</option>'+students.map(function(id){var a=rows.find(function(r){return r.studentId===id;});return '<option value="'+esc(id)+'">'+esc(a.studentName||id)+'</option>';}).join('');document.getElementById('trItem').innerHTML='<option value="all">All lessons</option>'+items.map(function(id){var a=rows.find(function(r){return r.contentId===id;});return '<option value="'+esc(id)+'">'+esc(a.title)+'</option>';}).join('');filter();}).catch(function(e){say(e.message);});}function filter(){var skill=document.getElementById('trSkill').value,student=document.getElementById('trStudent').value,item=document.getElementById('trItem').value,since=document.getElementById('trSince').value;var r=rows.filter(function(a){return(skill==='all'||a.skill===skill)&&(student==='all'||a.studentId===student)&&(item==='all'||a.contentId===item)&&(!since||a.completedAt.slice(0,10)>=since);});document.getElementById('trChart').innerHTML='';if(r.length)drawChart(document.getElementById('trChart'),r);document.getElementById('trRows').innerHTML=r.slice().reverse().map(function(a){return '<tr><td>'+esc(a.studentName)+'</td><td>'+esc(a.title)+'</td><td>'+esc(a.skill)+'</td><td>'+(a.score===null?'Not scored · answer key pending':a.score+'%')+' · '+a.correct+'/'+a.gradedCount+' scored</td><td>'+Math.round(a.durationSeconds/60)+' min</td><td>'+new Date(a.completedAt).toLocaleString()+'</td></tr>';}).join('')||'<tr><td colspan="6">No attempts for these filters.</td></tr>';}document.getElementById('trClass').onchange=refresh;['trSkill','trStudent','trItem','trSince'].forEach(function(id){document.getElementById(id).onchange=filter;});}
load();
})();

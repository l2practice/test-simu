<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261006"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFFAF5"><title>Test Simulation · IELTS Practice</title><link rel="stylesheet" href="vm-theme.css?v=20261006">
<style>
#app{min-height:100vh}.ielts-wrap{max-width:1180px;margin:auto}.ielts-hero{background:linear-gradient(120deg,#FFF0EB,#FFF7EC);color:var(--vm-ink);padding:24px;border-radius:var(--vm-r);margin-bottom:18px}.ielts-hero h2{margin:0 0 6px;font-family:var(--vm-font-display)}.ielts-hero p{margin:0;color:var(--vm-ink-2)}.il-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.il-card,.il-panel{background:var(--vm-surface);border:1px solid var(--vm-border-2);border-radius:var(--vm-r);padding:18px;box-shadow:var(--vm-shadow-sm)}.il-card h3{margin:5px 0;font-family:var(--vm-font-display)}.il-meta{font-size:.78rem;color:var(--vm-ink-3);margin:6px 0 12px}.il-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.il-practice{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);gap:16px}.il-passage{white-space:pre-wrap;line-height:1.85;max-height:68vh;overflow:auto}.il-q{border-bottom:1px solid var(--vm-border-2);padding:12px 0}.il-q label{display:block;font-weight:650;margin-bottom:7px}.il-q input,.il-q select{width:100%}.il-badge{display:inline-block;border-radius:99px;padding:3px 9px;background:var(--vm-primary-lt);color:var(--vm-primary-dk);font-size:.7rem;font-weight:700}.il-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.il-empty{padding:35px;text-align:center;color:var(--vm-ink-3)}.il-editor{display:grid;grid-template-columns:1fr 1fr;gap:10px}.il-editor textarea{min-height:130px;font-family:monospace;font-size:.82rem}.il-chart{width:100%;height:220px;border:1px solid var(--vm-border-2);border-radius:10px;background:var(--vm-surface);margin-top:10px}.il-note{font-size:.78rem;color:var(--vm-ink-3)}.il-error{color:var(--vm-danger);font-size:.84rem}.il-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.vm-shell{display:block;min-height:100vh;padding:0}.vm-side{position:sticky;z-index:20;top:0;width:auto;height:auto;min-height:68px;border:0;border-bottom:1px solid var(--vm-border-2);border-radius:0;box-shadow:none;padding:10px max(22px,calc((100vw - 1320px)/2));display:flex;flex-direction:row;align-items:center;gap:10px;background:#fff;overflow:visible}.vm-side .vm-logo{margin:0 30px 0 0}.vm-side .vm-logo-mark{width:40px;height:40px}.vm-side .vm-logo-name,.vm-nav-group{display:inline}.vm-nav{width:auto;height:auto;min-height:40px;padding:10px 13px;white-space:nowrap}.vm-side>div[style*="margin-top:auto"]{margin:0 0 0 auto!important;display:block;padding:0}.vm-main{gap:0}.vm-topbar{background:transparent;border:0;max-width:1180px;width:100%;margin:0 auto;padding:26px 24px 16px}.vm-content{max-width:1180px;width:100%;margin:0 auto;padding:4px 24px 60px}.ielts-wrap{max-width:none}.ielts-hero{border:1px solid #f8e4dc;border-radius:24px;padding:30px 34px}.ielts-hero p{color:var(--vm-ink-2)}.il-card,.il-panel{border-radius:20px}.il-card{transition:transform .16s,box-shadow .16s}.il-card:hover{transform:translateY(-3px);box-shadow:var(--vm-shadow)}

</style></head><body><div id="app"></div><script src="vm-common.js?v=20261006b"></script><script>
(function(){
'use strict';
var sess=VM.session.require(); if(!sess) return;
var teacher=sess.role==='teacher', state={items:[],attempts:[],classes:[],active:null,started:'',answers:[],filter:(sessionStorage.getItem('testsimu_skill')||'all')};
VM.renderShell({mount:'app',eyebrow:'Test Simulation · IELTS',title:'IELTS Practice',user:sess,nav:[
{id:'home',label:teacher?'IELTS Library':'IELTS Practice',icon:'reading',active:true,href:'ielts.html'},
{id:'back',label:'Back to app',icon:'overview',href:teacher?'teacher.html':'student.html'}
],onNav:function(id){if(id==='home')load();}});
function esc(x){return VM.esc(String(x==null?'':x));}
function root(){return document.getElementById('vmContent');}
function say(msg){VM.toast(msg,'error');}
function call(a,p){return VM.api(a,p||{}).then(function(r){if(!r||!r.success)throw new Error(r&&r.error||'Không thể tải dữ liệu.');return r.data;});}
function load(){root().innerHTML='<div class="il-empty">Đang tải…</div>';var second=teacher?call('class.list'):call('ielts.attempt.list');Promise.all([call('ielts.content.list'),second]).then(function(v){state.items=v[0]||[];if(teacher)state.classes=v[1]||[];else state.attempts=v[1]||[];draw();}).catch(function(e){root().innerHTML='<div class="il-empty">'+esc(e.message)+'</div>';});}
function draw(){if(state.active)return renderPractice(); if(teacher)return drawTeacher(); drawStudent();}
function titleItem(x){return x.title||'Untitled IELTS practice';}
function drawStudent(){var items=state.items.filter(function(x){return x.status==='published'||x.status==='review'||x.visibility==='private';});root().innerHTML='<div class="ielts-wrap"><div class="ielts-hero"><h2>Reading & Listening practice</h2><p>Choose a published lesson or make a private practice set.</p></div><div class="il-toolbar"><select class="vm-select" id="skill"><option value="all">All skills</option><option value="reading">Reading</option><option value="listening">Listening</option></select><select class="vm-select" id="task"><option value="all">All task types</option>'+taskOptions()+'</select><button class="vm-btn vm-btn-primary" id="full">Full Test · 3 sections</button><button class="vm-btn vm-btn-ghost" id="free">＋ Free practice</button><button class="vm-btn vm-btn-ghost" id="results">My results</button></div><div class="il-grid" id="cards"></div><div id="extra"></div></div>';document.getElementById('skill').value=state.filter;function cards(){var skill=document.getElementById('skill').value,task=document.getElementById('task').value;var rows=items.filter(function(x){return(skill==='all'||x.skill===skill)&&(task==='all'||(x.taskTypes||[]).indexOf(task)>=0);});document.getElementById('cards').innerHTML=rows.length?rows.map(function(x){return '<article class="il-card"><span class="il-badge">'+esc(x.skill)+'</span><h3>'+esc(titleItem(x))+'</h3><div class="il-meta">'+(x.sections||[]).length+' section(s) · '+(x.sections||[]).reduce(function(n,s){return n+(s.questions||[]).length;},0)+' questions'+(x.status==='published'?' · Published':(x.status==='review'?' · Chờ kiểm tra':' · Private'))+'</div><div class="il-meta">'+esc((x.taskTypes||[]).join(' · '))+'</div><button class="vm-btn vm-btn-primary" data-open="'+esc(x.id||x._id)+'">Start practice</button></article>';}).join(''):'<div class="il-empty">No lessons match these filters yet.</div>';Array.from(document.querySelectorAll('[data-open]')).forEach(function(b){b.onclick=function(){call('ielts.content.get',{id:b.dataset.open}).then(function(x){state.active=x;state.started=new Date().toISOString();state.answers=[];draw();}).catch(function(e){say(e.message);});};});}document.getElementById('skill').onchange=cards;document.getElementById('task').onchange=cards;cards();document.getElementById('full').onclick=function(){var skill=document.getElementById('skill').value;if(skill==='all')skill='reading';var candidates=items.filter(function(x){return (x.status==='published'||x.status==='review')&&x.skill===skill;});if(candidates.length<3){say('Cần ít nhất ba bài đã publish cùng skill để tạo Full Test.');return;}var chosen=candidates.slice(0,3),combined={id:chosen.map(function(x){return x.id||x._id;}).join(','),title:'Full Test · '+skill,skill:skill,visibility:'library',version:1,taskTypes:Array.from(new Set([].concat.apply([],chosen.map(function(x){return x.taskTypes||[];})))),sections:chosen.reduce(function(a,x){return a.concat(x.sections||[]);},[])};state.active=combined;state.started=new Date().toISOString();draw();};document.getElementById('free').onclick=function(){editorDialog(true);};document.getElementById('results').onclick=studentResults;}
function taskOptions(){return ['short-answer','sentence-completion','summary-completion','diagram-completion','multiple-choice','matching-features','matching-headings','true-false-not-given'].map(function(x){return '<option value="'+x+'">'+x.replace(/-/g,' ')+'</option>';}).join('');}
function renderPractice(){var x=state.active,qs=(x.sections||[]).flatMap(function(s){return s.questions||[];});root().innerHTML='<div class="ielts-wrap"><div class="il-toolbar"><button class="vm-btn vm-btn-ghost" id="exit">← Library</button><span class="il-badge">'+esc(x.skill)+'</span><span class="il-badge">'+esc(titleItem(x))+'</span><span class="il-note">Version '+esc(x.version||1)+'</span></div><div class="il-practice"><section class="il-panel il-passage"><h2>'+esc(titleItem(x))+'</h2>'+ (x.sections||[]).map(function(s,i){return '<h3>'+esc(s.title||('Section '+(i+1)))+'</h3>'+(s.audio&&s.audio.path?'<audio controls preload="none" data-audio-path="'+esc(s.audio.path)+'"></audio>':'')+'<div>'+esc(s.text)+'</div>';}).join('')+'</section><section class="il-panel"><h3>Questions</h3>'+qs.map(function(q,i){var choices=q.options&&q.options.length?'<select data-answer="'+i+'"><option value="">Choose…</option>'+q.options.map(function(o){return '<option>'+esc(o)+'</option>';}).join('')+'</select>':'<input class="vm-input" data-answer="'+i+'" placeholder="Your answer">';return '<div class="il-q"><label>'+(i+1)+'. '+esc(q.prompt)+'</label><div class="il-note">'+esc(q.type.replace(/-/g,' '))+'</div>'+choices+'</div>';}).join('')+'<button class="vm-btn vm-btn-primary" style="margin-top:14px" id="submit">Submit attempt</button> <button class="vm-btn vm-btn-ghost" style="margin-top:14px" id="report">Report a problem</button></section></div></div>';Array.from(document.querySelectorAll('[data-audio-path]')).forEach(function(a){call('ielts.audio.url',{path:a.getAttribute('data-audio-path')}).then(function(url){a.src=url;}).catch(function(e){say(e.message);});});document.getElementById('exit').onclick=function(){state.active=null;draw();};document.getElementById('report').onclick=function(){var n=prompt('Question number (optional):'),message=prompt('Describe the issue for your teacher:');if(!message)return;call('ielts.report.create',{contentId:String(x.id||x._id).split(',')[0],contentTitle:titleItem(x),questionNumber:n,message:message,privateContent:x.visibility==='private'}).then(function(){VM.toast('Report sent to your teacher.','success');}).catch(function(e){say(e.message);});};document.getElementById('submit').onclick=function(){if(!confirm('Submit this attempt?'))return;var a=Array.from(document.querySelectorAll('[data-answer]')).map(function(e){return e.value;});call('ielts.attempt.save',{contentIds:String(x.id||x._id).split(','),answers:a,startedAt:state.started}).then(function(r){state.attempts.push(r);state.active=null;VM.toast('Attempt saved · practice score '+r.score+'%','success');draw();}).catch(function(e){say(e.message);});};}
function drawTeacher(){root().innerHTML='<div class="ielts-wrap"><div class="ielts-hero"><h2>IELTS Library</h2><p>Create content, check drafts and publish approved items to selected classes.</p></div><div class="il-toolbar"><button class="vm-btn vm-btn-primary" id="new">＋ New content</button><button class="vm-btn vm-btn-ghost" id="url">Import from URL</button><button class="vm-btn vm-btn-ghost" id="tresults">Class results</button><button class="vm-btn vm-btn-ghost" id="reports">Student reports</button></div><div class="il-grid">'+(state.items.length?state.items.map(function(x){return '<article class="il-card"><span class="il-badge">'+esc(x.skill)+' · '+esc(x.status==='review'?'Chờ kiểm tra':x.status)+'</span><h3>'+esc(titleItem(x))+'</h3><div class="il-meta">'+esc((x.taskTypes||[]).join(' · '))+' · v'+esc(x.version||1)+'</div><button class="vm-btn vm-btn-primary" data-edit="'+esc(x.id||x._id)+'">Edit / review</button> '+(x.status!=='archived'?'<button class="vm-btn vm-btn-ghost" data-archive="'+esc(x.id||x._id)+'">Archive</button>':'')+'</article>';}).join(''):'<div class="il-empty">No Library content yet.</div>')+'</div><div id="extra"></div></div>';document.getElementById('new').onclick=function(){editorDialog(false);};document.getElementById('url').onclick=importUrl;document.getElementById('tresults').onclick=teacherResults;document.getElementById('reports').onclick=teacherReports;Array.from(document.querySelectorAll('[data-edit]')).forEach(function(b){b.onclick=function(){call('ielts.content.get',{id:b.dataset.edit}).then(function(x){editorDialog(false,x);}).catch(function(e){say(e.message);});};});Array.from(document.querySelectorAll('[data-archive]')).forEach(function(b){b.onclick=function(){if(confirm('Archive this content? Existing attempts remain saved.'))call('ielts.content.archive',{id:b.dataset.archive}).then(load).catch(function(e){say(e.message);});};});}
function exampleQuestions(x){return JSON.stringify(x||[{type:'multiple-choice',prompt:'Which statement is supported by the passage?',options:['A','B','C','D'],answers:['A']}],null,2);}
function editorDialog(priv,initial){var x=initial||{skill:'reading',title:'',sections:[{title:'Passage 1',text:'',questions:[]}]};var html='<div class="il-panel" style="margin-top:18px"><h3>'+(priv?'Create private practice':'Create / review content')+'</h3><div class="il-editor"><div><label class="vm-label">Title</label><input class="vm-input" id="edTitle" value="'+esc(x.title)+'"><label class="vm-label">Skill</label><select class="vm-select" id="edSkill"><option value="reading">Reading</option><option value="listening">Listening</option></select><label class="vm-label">Source URL</label><input class="vm-input" id="edUrl" value="'+esc(x.sourceUrl||'')+'"><label class="vm-label">Attribution / licence note</label><input class="vm-input" id="edAttr" value="'+esc(x.attribution||'')+'"><label class="vm-label">Class with access</label><select class="vm-select" id="edClasses"><option value="">Choose later (draft only)</option>'+state.classes.map(function(c){var selected=(x.allowedClassIds||[]).includes(c.classId);return '<option value="'+esc(c.classId)+'" '+(selected?'selected':'')+'>'+esc(c.className)+'</option>';}).join('')+'</select></div><div><label class="vm-label">Passages / sections and questions (JSON, up to 3)</label><textarea class="vm-input" id="edSections" style="min-height:320px">'+esc(JSON.stringify(x.sections&&x.sections.length?x.sections:[{title:'Passage 1',text:'',questions:[]}],null,2))+'</textarea><label class="vm-label">Attach or replace audio for the first Listening section (max 25 MB)</label><input class="vm-input" type="file" id="edAudio" accept="audio/mpeg,audio/mp4,audio/wav,audio/x-wav,audio/webm,audio/ogg,audio/aac,audio/flac"><div class="il-note">'+(x.sections&&x.sections[0]&&x.sections[0].audio?'Current audio: '+esc(x.sections[0].audio.fileName||'uploaded'):'')+' · Accepted audio: MP3, MP4, WAV, WebM, OGG, AAC, FLAC. Do not upload audio from the source website.</div><p class="il-note">Each section has title, text, questions. Each question has type, prompt, options (optional), answers (accepted answers). Audio can be attached to the first section after saving a draft.</p></div></div><div id="edError" class="il-error"></div><div class="il-row" style="margin-top:12px"><button class="vm-btn vm-btn-primary" id="saveDraft">Save draft</button>'+(priv?'':'<button class="vm-btn vm-btn-ghost" id="review">Send to library for review</button><button class="vm-btn" id="publish" style="background:var(--vm-primary);color:white">Publish to selected class</button>')+'<button class="vm-btn vm-btn-ghost" id="cancel">Cancel</button></div></div>';document.getElementById('extra').innerHTML=html;var edFile=null;document.getElementById('edAudio').onchange=function(){edFile=this.files&&this.files[0]||null;};document.getElementById('edSkill').value=x.skill||'reading';document.getElementById('cancel').onclick=function(){document.getElementById('extra').innerHTML='';};function save(status){var sections;try{sections=JSON.parse(document.getElementById('edSections').value);if(!Array.isArray(sections)||!sections.length||sections.length>3)throw new Error('sections');}catch(e){document.getElementById('edError').textContent='Sections must be a valid JSON array with one to three sections.';return;}var cls=document.getElementById('edClasses').value;var data={id:x.id||x._id,title:document.getElementById('edTitle').value,skill:document.getElementById('edSkill').value,sourceUrl:document.getElementById('edUrl').value,sourceTitle:x.sourceTitle||'',sourceTestNumber:x.sourceTestNumber||'',attribution:document.getElementById('edAttr').value,allowedClassIds:cls?[cls]:[],visibility:priv?'private':'library',status:status,sections:sections};if(edFile&&data.skill!=='listening'){document.getElementById('edError').textContent='Audio can only be attached to Listening content.';return;}call('ielts.content.save',data).then(function(saved){if(!edFile)return saved;return call('ielts.audio.upload',{contentId:saved.id,file:edFile}).then(function(up){return call('ielts.audio.attach',{contentId:saved.id,audioPath:up.path,fileName:up.fileName,contentType:up.contentType,size:up.size});});}).then(function(){VM.toast(status==='published'?'Published to selected class.':'Draft saved.','success');load();}).catch(function(e){document.getElementById('edError').textContent=e.message;});}document.getElementById('saveDraft').onclick=function(){save(priv?'private':'draft');};var review=document.getElementById('review');if(review)review.onclick=function(){save('review');};var pub=document.getElementById('publish');if(pub)pub.onclick=function(){if(!document.getElementById('edTitle').value.trim())return;save('published');};}
function importUrl(){var url=prompt('Enter a specific IELTS Training Online lesson URL (HTTPS only).');if(!url)return;call('ielts.importUrl',{url:url}).then(function(d){editorDialog(false,{title:d.title||'',sourceUrl:url,sourceTitle:d.sourceTitle||'',skill:d.skill||'reading',sections:d.sections||[]});if(d.warning)say(d.warning);}).catch(function(e){say(e.message);});}
function teacherReports(){call('ielts.report.list').then(function(rows){document.getElementById('extra').innerHTML='<div class="il-panel" style="margin-top:16px"><h3>Student reports</h3><div style="overflow:auto"><table class="vm-table"><thead><tr><th>Student</th><th>Lesson</th><th>Question</th><th>Report</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(rows.length?rows.map(function(r){return '<tr><td>'+esc(r.studentName)+'</td><td>'+esc(r.contentTitle)+'</td><td>'+esc(r.questionNumber||'—')+'</td><td>'+esc(r.message)+'</td><td>'+esc(r.status)+'</td><td><button class="vm-btn vm-btn-sm" data-resolve="'+esc(r.id||r._id)+'">Mark resolved</button></td></tr>';}).join(''):'<tr><td colspan="6">No reports.</td></tr>')+'</tbody></table></div></div>';Array.from(document.querySelectorAll('[data-resolve]')).forEach(function(b){b.onclick=function(){call('ielts.report.update',{id:b.dataset.resolve,status:'resolved'}).then(teacherReports).catch(function(e){say(e.message);});};});}).catch(function(e){say(e.message);});}function drawChart(el,rows){rows=rows.filter(function(r){return typeof r.score==='number'&&isFinite(r.score);});if(!rows.length)return;var w=700,h=210,p=28;var pts=rows.map(function(r,i){return [p+(rows.length<2?0:i*(w-2*p)/(rows.length-1)),h-p-r.score*(h-2*p)/100];});var line=pts.map(function(a){return a.join(',');}).join(' ');el.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" class="il-chart" role="img" aria-label="Practice score over time"><line x1="'+p+'" y1="'+(h-p)+'" x2="'+(w-p)+'" y2="'+(h-p)+'" stroke="#9ca3af"/><line x1="'+p+'" y1="'+p+'" x2="'+p+'" y2="'+(h-p)+'" stroke="#9ca3af"/><text x="4" y="'+(p+4)+'" font-size="12">100</text><text x="12" y="'+(h-p)+'" font-size="12">0</text><polyline fill="none" stroke="#FF6B52" stroke-width="3" points="'+line+'"/>'+pts.map(function(a,i){return '<circle cx="'+a[0]+'" cy="'+a[1]+'" r="4" fill="#FF6B52"><title>'+rows[i].score+'% · '+esc(rows[i].title)+'</title></circle>';}).join('')+'</svg>';}
function studentResults(){var rows=state.attempts.slice(-50);document.getElementById('extra').innerHTML='<div class="il-panel" style="margin-top:16px"><h3>My practice results</h3><div class="il-toolbar"><select id="rsSkill" class="vm-select"><option value="all">Reading & Listening</option><option value="reading">Reading</option><option value="listening">Listening</option></select><label>From <input id="rsDate" type="date" class="vm-input"></label></div><div id="chart"></div><p id="empty" class="il-empty" style="display:none">Complete an attempt to see progress here.</p><div style="overflow:auto"><table class="vm-table"><thead><tr><th>Lesson</th><th>Skill</th><th>Score (practice)</th><th>Questions correct</th><th>Time</th><th>Date</th></tr></thead><tbody id="history"></tbody></table></div></div>';function refresh(){var skill=document.getElementById('rsSkill').value,since=document.getElementById('rsDate').value;var r=rows.filter(function(a){return(skill==='all'||a.skill===skill)&&(!since||a.completedAt.slice(0,10)>=since);});var e=document.getElementById('empty');e.style.display=r.length?'none':'block';document.getElementById('chart').innerHTML='';if(r.length)drawChart(document.getElementById('chart'),r);document.getElementById('history').innerHTML=r.slice().reverse().map(function(a){return '<tr><td>'+esc(a.title)+'</td><td>'+esc(a.skill)+'</td><td>'+(a.score===null?'Not scored · answer key pending':a.score+'%')+'</td><td>'+a.correct+'/'+a.gradedCount+' scored ('+a.total+' total)'+'</td><td>'+Math.round(a.durationSeconds/60)+' min</td><td>'+new Date(a.completedAt).toLocaleDateString()+'</td></tr>';}).join('');}document.getElementById('rsSkill').onchange=refresh;document.getElementById('rsDate').onchange=refresh;refresh();}
function teacherResults(){document.getElementById('extra').innerHTML='<div class="il-panel" style="margin-top:16px"><h3>Class results</h3><div class="il-toolbar"><select class="vm-select" id="trClass"><option value="">Select a class</option>'+state.classes.map(function(c){return '<option value="'+esc(c.classId)+'">'+esc(c.className)+'</option>';}).join('')+'</select><select class="vm-select" id="trSkill"><option value="all">All skills</option><option value="reading">Reading</option><option value="listening">Listening</option></select><select class="vm-select" id="trStudent"><option value="all">All students</option></select><select class="vm-select" id="trItem"><option value="all">All lessons</option></select><input class="vm-input" type="date" id="trSince" aria-label="Start date"></div><div id="trChart"></div><div style="overflow:auto"><table class="vm-table"><thead><tr><th>Student</th><th>Lesson</th><th>Skill</th><th>Practice score</th><th>Time</th><th>Completed</th></tr></thead><tbody id="trRows"></tbody></table></div></div>';var rows=[];function refresh(){var cls=document.getElementById('trClass').value;if(!cls){document.getElementById('trRows').innerHTML='<tr><td colspan="6">Choose a class to view results.</td></tr>';document.getElementById('trChart').innerHTML='';return;}call('ielts.attempt.list',{classId:cls}).then(function(data){rows=data||[];var students=Array.from(new Set(rows.map(function(a){return a.studentId;})));var items=Array.from(new Set(rows.map(function(a){return a.contentId;})));document.getElementById('trStudent').innerHTML='<option value="all">All students</option>'+students.map(function(id){var a=rows.find(function(r){return r.studentId===id;});return '<option value="'+esc(id)+'">'+esc(a.studentName||id)+'</option>';}).join('');document.getElementById('trItem').innerHTML='<option value="all">All lessons</option>'+items.map(function(id){var a=rows.find(function(r){return r.contentId===id;});return '<option value="'+esc(id)+'">'+esc(a.title)+'</option>';}).join('');filter();}).catch(function(e){say(e.message);});}function filter(){var skill=document.getElementById('trSkill').value,student=document.getElementById('trStudent').value,item=document.getElementById('trItem').value,since=document.getElementById('trSince').value;var r=rows.filter(function(a){return(skill==='all'||a.skill===skill)&&(student==='all'||a.studentId===student)&&(item==='all'||a.contentId===item)&&(!since||a.completedAt.slice(0,10)>=since);});document.getElementById('trChart').innerHTML='';if(r.length)drawChart(document.getElementById('trChart'),r);document.getElementById('trRows').innerHTML=r.slice().reverse().map(function(a){return '<tr><td>'+esc(a.studentName)+'</td><td>'+esc(a.title)+'</td><td>'+esc(a.skill)+'</td><td>'+(a.score===null?'Not scored · answer key pending':a.score+'%')+' · '+a.correct+'/'+a.gradedCount+' scored</td><td>'+Math.round(a.durationSeconds/60)+' min</td><td>'+new Date(a.completedAt).toLocaleString()+'</td></tr>';}).join('')||'<tr><td colspan="6">No attempts for these filters.</td></tr>';}document.getElementById('trClass').onchange=refresh;['trSkill','trStudent','trItem','trSince'].forEach(function(id){document.getElementById(id).onchange=filter;});}
load();
})();
</script></body></html>
